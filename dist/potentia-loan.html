<meta charset="utf-8">
<title>Potentia Loan — État des lieux & inventaire</title>
<style>
/* === 10-screen.css === */
/* ------------------------------------------------------------------
   Potentia Loan — styles écran
   Direction : neutre administratif. Gris et noir, aucun effet décoratif.
   ------------------------------------------------------------------ */

:root {
  --fond: #f4f5f6;
  --fond-carte: #ffffff;
  --fond-sourd: #eceef0;
  --fond-entete-tableau: #e4e7e9;
  --texte: #16181a;
  --texte-sourd: #5c6165;
  --bordure: #cfd3d6;
  --bordure-forte: #9aa0a5;
  --accent: #24282b;
  --accent-texte: #ffffff;
  --danger: #8c1d18;
  --danger-fond: #fbeceb;
  --ok: #1d5c2e;
  --focus: #0b5cad;
  --rayon: 3px;
  --pas: 8px;
  --cible: 44px;
  --largeur-max: 1180px;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --fond: #131518;
    --fond-carte: #1c1f22;
    --fond-sourd: #24282c;
    --fond-entete-tableau: #2b3035;
    --texte: #e9ebed;
    --texte-sourd: #a4abb1;
    --bordure: #3a4046;
    --bordure-forte: #5d656c;
    --accent: #e9ebed;
    --accent-texte: #16181a;
    --danger: #f2b8b5;
    --danger-fond: #3a1f1d;
    --ok: #8fd3a2;
    --focus: #7cb7f0;
  }
}

:root[data-theme="light"] {
  --fond: #f4f5f6;
  --fond-carte: #ffffff;
  --fond-sourd: #eceef0;
  --fond-entete-tableau: #e4e7e9;
  --texte: #16181a;
  --texte-sourd: #5c6165;
  --bordure: #cfd3d6;
  --bordure-forte: #9aa0a5;
  --accent: #24282b;
  --accent-texte: #ffffff;
  --danger: #8c1d18;
  --danger-fond: #fbeceb;
  --ok: #1d5c2e;
  --focus: #0b5cad;
}

:root[data-theme="dark"] {
  --fond: #131518;
  --fond-carte: #1c1f22;
  --fond-sourd: #24282c;
  --fond-entete-tableau: #2b3035;
  --texte: #e9ebed;
  --texte-sourd: #a4abb1;
  --bordure: #3a4046;
  --bordure-forte: #5d656c;
  --accent: #e9ebed;
  --accent-texte: #16181a;
  --danger: #f2b8b5;
  --danger-fond: #3a1f1d;
  --ok: #8fd3a2;
  --focus: #7cb7f0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fond);
  color: var(--texte);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 650; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: 0.95rem; }
p { margin: 0 0 var(--pas); }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.saut-contenu {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--accent); color: var(--accent-texte);
  padding: 12px 16px; text-decoration: none;
}
.saut-contenu:focus { left: 0; }

/* --- ossature ------------------------------------------------------ */

.app-entete {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--pas);
  padding: 10px 16px;
  background: var(--fond-carte);
  border-bottom: 1px solid var(--bordure);
  flex-wrap: wrap;
}

.app-entete__marque { display: flex; align-items: center; gap: 10px; }
.app-logo { width: 26px; height: 26px; color: var(--texte); flex: none; }
.app-entete__titre { font-weight: 650; letter-spacing: 0.01em; }

.app-entete__actions { display: flex; gap: 6px; flex-wrap: wrap; }

#vue {
  display: block;
  max-width: var(--largeur-max);
  margin: 0 auto;
  padding: 16px 16px 96px;
}
#vue:focus { outline: none; }

.app-pied {
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px;
  max-width: var(--largeur-max);
  margin: 0 auto;
  padding: 12px 16px 28px;
  color: var(--texte-sourd);
  font-size: 0.78rem;
  border-top: 1px solid var(--bordure);
}

/* --- fil d'ariane / titre de vue ----------------------------------- */

.vue-entete {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: var(--pas); flex-wrap: wrap; margin-bottom: 14px;
}
.vue-entete__texte { min-width: 0; }
.vue-entete__sur {
  font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--texte-sourd); margin-bottom: 2px;
}

/* --- boutons -------------------------------------------------------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--cible); min-width: var(--cible);
  padding: 0 14px;
  font: inherit; font-size: 0.9rem; font-weight: 550;
  color: var(--texte);
  background: var(--fond-carte);
  border: 1px solid var(--bordure-forte);
  border-radius: var(--rayon);
  cursor: pointer;
  text-align: center;
}
.btn:hover { background: var(--fond-sourd); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

.btn--principal { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }
.btn--principal:hover { filter: brightness(1.15); background: var(--accent); }
.btn--discret { border-color: transparent; background: transparent; }
.btn--discret:hover { background: var(--fond-sourd); }
.btn--danger { color: var(--danger); border-color: var(--danger); }
.btn--danger:hover { background: var(--danger-fond); }
/* « petit » joue sur le poids visuel (police, marges), jamais sur la hauteur
   de la cible tactile : l'outil s'utilise debout, parfois avec des gants. */
.btn--petit { min-height: var(--cible); padding: 0 12px; font-size: 0.82rem; }
.btn--bloc { width: 100%; }

.barre-actions {
  display: flex; gap: var(--pas); flex-wrap: wrap;
  margin-top: 18px; padding-top: 14px;
  border-top: 1px solid var(--bordure);
}

/* --- cartes et sections -------------------------------------------- */

.carte {
  background: var(--fond-carte);
  border: 1px solid var(--bordure);
  border-radius: var(--rayon);
  padding: 14px;
  margin-bottom: 14px;
}
.carte__entete {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--pas); flex-wrap: wrap; margin-bottom: 12px;
}
.carte__titre { display: flex; align-items: center; gap: 8px; min-width: 0; }
.carte--sourde { background: var(--fond-sourd); }

.note {
  font-size: 0.82rem; color: var(--texte-sourd);
  border-left: 3px solid var(--bordure-forte);
  padding: 6px 0 6px 10px; margin: 10px 0;
}
.note--alerte { border-left-color: var(--danger); color: var(--danger); }

.etat-vide {
  text-align: center; padding: 40px 16px; color: var(--texte-sourd);
  border: 1px dashed var(--bordure-forte); border-radius: var(--rayon);
}

/* --- champs --------------------------------------------------------- */

.champ { display: block; margin-bottom: 12px; }
.champ__label {
  display: block; font-size: 0.8rem; font-weight: 600;
  color: var(--texte-sourd); margin-bottom: 4px;
}
.champ__saisie {
  display: flex; align-items: center; gap: 6px;
}
.champ input[type="text"],
.champ input[type="number"],
.champ input[type="date"],
.champ textarea,
.champ select {
  width: 100%;
  min-height: var(--cible);
  padding: 8px 10px;
  font: inherit;
  color: var(--texte);
  background: var(--fond-carte);
  border: 1px solid var(--bordure-forte);
  border-radius: var(--rayon);
}
.champ textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
/* Les relevés et quantités se lisent en colonne : chiffres à chasse fixe. */
.champ input[type="number"],
.champ input[type="date"],
.inv-ligne__qte input,
.hub-item__compte,
.dossier-ligne__meta,
.etat-lecture__pastille,
.segmente__opt { font-variant-numeric: tabular-nums; }
.champ__suffixe { color: var(--texte-sourd); font-size: 0.85rem; white-space: nowrap; }

.grille-champs {
  display: grid; gap: 0 14px;
  grid-template-columns: 1fr;
}
@media (min-width: 700px) {
  .grille-champs { grid-template-columns: 1fr 1fr; }
  .grille-champs .champ--large { grid-column: 1 / -1; }
}

.case {
  display: flex; align-items: center; gap: 10px;
  min-height: var(--cible); padding: 4px 8px;
  border: 1px solid var(--bordure); border-radius: var(--rayon);
  cursor: pointer; font-size: 0.9rem;
  background: var(--fond-carte);
}
.case input { width: 20px; height: 20px; flex: none; accent-color: var(--focus); }
.case--cochee { border-color: var(--bordure-forte); background: var(--fond-sourd); }
.grille-cases {
  display: grid; gap: 6px;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
}

/* --- sélecteur d'état segmenté -------------------------------------- */

.segmente { display: flex; gap: 4px; flex-wrap: wrap; }
.segmente__opt {
  flex: 1 1 0; min-width: 46px;
  min-height: var(--cible);
  display: inline-flex; align-items: center; justify-content: center;
  font: inherit; font-size: 0.85rem; font-weight: 650;
  color: var(--texte);
  background: var(--fond-carte);
  border: 1px solid var(--bordure-forte);
  border-radius: var(--rayon);
  cursor: pointer;
}
.segmente__opt[aria-checked="true"] {
  background: var(--accent); color: var(--accent-texte); border-color: var(--accent);
}
.segmente--desactive { opacity: 0.4; pointer-events: none; }
.segmente__opt:hover { background: var(--fond-sourd); }
.segmente__opt[aria-checked="true"]:hover { background: var(--accent); }

.etat-lecture {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.78rem; color: var(--texte-sourd);
}
.etat-lecture__pastille {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 30px; height: 24px; padding: 0 6px;
  border: 1px solid var(--bordure-forte); border-radius: var(--rayon);
  font-weight: 700; font-size: 0.75rem; color: var(--texte);
}

/* --- hub ------------------------------------------------------------ */

.hub-grille {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}
.hub-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 68px; padding: 12px 14px; text-align: left;
  background: var(--fond-carte);
  border: 1px solid var(--bordure-forte);
  border-radius: var(--rayon);
  cursor: pointer; font: inherit; color: var(--texte);
}
.hub-item:hover { background: var(--fond-sourd); }
.hub-item__titre { font-weight: 600; }
.hub-item__sous { font-size: 0.78rem; color: var(--texte-sourd); }
.hub-item__compte {
  font-size: 0.75rem; font-weight: 700; white-space: nowrap;
  padding: 3px 7px; border-radius: 999px;
  background: var(--fond-sourd); border: 1px solid var(--bordure);
}
.hub-item__compte--complet { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }

.jauge {
  height: 6px; background: var(--fond-sourd);
  border: 1px solid var(--bordure); border-radius: 999px; overflow: hidden;
}
.jauge__barre { height: 100%; background: var(--bordure-forte); }
.jauge__barre--alerte { background: var(--danger); }

/* --- liste des dossiers --------------------------------------------- */

.liste-dossiers { display: grid; gap: 10px; }
.dossier-ligne {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding: 12px 14px;
  background: var(--fond-carte);
  border: 1px solid var(--bordure); border-radius: var(--rayon);
}
.dossier-ligne__info { min-width: 200px; flex: 1 1 240px; }
.dossier-ligne__titre { font-weight: 600; }
.dossier-ligne__meta { font-size: 0.78rem; color: var(--texte-sourd); }
.dossier-ligne__actions { display: flex; gap: 6px; flex-wrap: wrap; }

.badge {
  display: inline-block; font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em;
  padding: 2px 6px; border-radius: var(--rayon);
  border: 1px solid var(--bordure-forte); color: var(--texte-sourd);
}
.badge--signe { border-color: var(--ok); color: var(--ok); }
.badge--sortie { border-color: var(--focus); color: var(--focus); }

/* --- mise en page deux colonnes (tablette et plus) ------------------ */

.duo { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: start; }
/* Sans min-width:0 un élément de grille ne rétrécit pas sous la largeur de son
   contenu : la barre défilante étirerait la page entière. */
.duo > * { min-width: 0; }
.grille-champs > *, .constat-grille > *, .inv-ligne > * { min-width: 0; }
@media (min-width: 900px) {
  .duo { grid-template-columns: 260px minmax(0, 1fr); }
  .duo__aside { position: sticky; top: 76px; }
}
.liste-nav { display: grid; gap: 4px; }
.liste-nav__item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: var(--cible); padding: 8px 10px; text-align: left;
  font: inherit; font-size: 0.9rem; color: var(--texte);
  background: transparent; border: 1px solid transparent;
  border-radius: var(--rayon); cursor: pointer;
}
.liste-nav__item:hover { background: var(--fond-sourd); }
.liste-nav__item[aria-current="true"] {
  background: var(--fond-carte); border-color: var(--bordure-forte); font-weight: 650;
}

/* Sous 900 px la colonne latérale passe au-dessus : en liste verticale elle
   repousserait la saisie hors de l'écran. On la replie en barre défilante. */
@media (max-width: 899px) {
  .liste-nav {
    grid-auto-flow: column;
    grid-auto-columns: max-content;
    overflow-x: auto;
    padding-bottom: 6px;
    gap: 6px;
  }
  .liste-nav__item {
    white-space: nowrap;
    border-color: var(--bordure);
    background: var(--fond-carte);
  }
  .duo__aside .carte { padding: 10px; }
}

/* --- lignes de constat ---------------------------------------------- */

.constat-ligne {
  padding: 12px 0;
  border-bottom: 1px solid var(--bordure);
}
.constat-ligne:last-child { border-bottom: 0; }
.constat-ligne__entete {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
}
.constat-ligne__nom { font-weight: 600; }
.constat-grille {
  display: grid; gap: 10px;
  grid-template-columns: 1fr;
}
@media (min-width: 640px) {
  .constat-grille { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
  .constat-grille .constat-grille__large { grid-column: 1 / -1; }
}

.inv-ligne {
  display: grid; gap: 10px;
  grid-template-columns: 1fr;
  padding: 12px 0; border-bottom: 1px solid var(--bordure);
}
.inv-ligne:last-child { border-bottom: 0; }
.inv-ligne__tete {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap;
}
.inv-ligne__nom { font-weight: 600; }
.inv-ligne__qte { width: 90px; flex: none; }
.inv-ligne--absente .inv-ligne__nom { text-decoration: line-through; color: var(--texte-sourd); }

/* --- photos ---------------------------------------------------------- */

.photos { margin-top: 10px; }
.photos__grille {
  display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
}
.photo-vignette {
  position: relative; aspect-ratio: 4 / 3; overflow: hidden;
  border: 1px solid var(--bordure); border-radius: var(--rayon);
  background: var(--fond-sourd);
}
.photo-vignette img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Seule exception à la règle des 44 px : superposé à une miniature de ~104 px,
   un bouton de 44 px la recouvrirait. 36 px reste très au-dessus du minimum
   WCAG 2.5.8 (24 px). */
.photo-vignette__suppr {
  position: absolute; top: 4px; right: 4px;
  width: 36px; height: 36px; border-radius: var(--rayon);
  display: flex; align-items: center; justify-content: center;
  background: var(--fond-carte); color: var(--danger);
  border: 1px solid var(--bordure-forte); cursor: pointer; font: inherit; font-weight: 700;
}
.photo-avant { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--texte-sourd); }
.photo-avant img {
  width: 54px; height: 40px; object-fit: cover;
  border: 1px solid var(--bordure); border-radius: var(--rayon);
}
.photo-ajout input[type="file"] { display: none; }

/* --- signature -------------------------------------------------------- */

.signature-bloc { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 800px) { .signature-bloc { grid-template-columns: 1fr 1fr; } }
.signature-zone {
  border: 1px solid var(--bordure-forte); border-radius: var(--rayon);
  background: #ffffff; touch-action: none; width: 100%; height: 170px; display: block;
}
.signature-legende {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-top: 6px; font-size: 0.78rem; color: var(--texte-sourd);
}

/* --- dialogue et annonces --------------------------------------------- */

.calque {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(0, 0, 0, 0.45);
}
.dialogue {
  width: min(560px, 100%); max-height: 86vh; overflow: auto;
  background: var(--fond-carte); color: var(--texte);
  border: 1px solid var(--bordure-forte); border-radius: var(--rayon);
  padding: 18px;
}
.dialogue__titre { margin-bottom: 10px; }
.dialogue__actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  z-index: 70; max-width: min(520px, calc(100vw - 32px));
  padding: 12px 16px; font-size: 0.88rem;
  background: var(--accent); color: var(--accent-texte);
  border-radius: var(--rayon);
}

.liste-manques { margin: 8px 0 0; padding-left: 18px; font-size: 0.85rem; color: var(--texte-sourd); }
.liste-manques li { margin-bottom: 2px; }

#conteneur-impression { display: none; }

.defilement-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}


/* === 20-print.css === */
/* ------------------------------------------------------------------
   Potentia Loan — feuille d'impression A4.
   Le document imprimé est un DOM distinct de l'interface de saisie.
   ------------------------------------------------------------------ */

@media print {
  @page {
    size: A4 portrait;
    margin: 12mm 12mm 16mm;
  }

  html, body {
    background: #ffffff !important;
    color: #000000 !important;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 10.5pt;
    line-height: 1.32;
  }

  /* Seul le document reconstruit est imprimé. */
  body > *:not(#conteneur-impression) { display: none !important; }

  #conteneur-impression {
    display: block !important;
    visibility: visible;
  }

  /* Pied répété : un élément fixe est réémis sur chaque page.
     `bottom` doit rester dans la zone de contenu — une valeur négative le
     projette dans la marge, ce qui décale le pied d'une page et fabrique
     une page fantôme ne contenant que lui. */
  .p-pied-global {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    font-size: 7.5pt;
    color: #444444;
    border-top: 0.4pt solid #999999;
    padding-top: 1.5mm;
    display: flex;
    justify-content: space-between;
    gap: 6mm;
  }

  .p-doc--nouvelle-page { break-before: page; }

  /* --- en-tête de document --- */

  .p-entete {
    border-bottom: 1.2pt solid #000000;
    padding-bottom: 2.5mm;
    margin-bottom: 4mm;
    break-after: avoid;
  }
  .p-entete h1 {
    font-size: 15pt;
    letter-spacing: 0.01em;
    margin: 0 0 1mm;
  }
  .p-entete__sous { font-size: 9pt; color: #333333; margin: 0; }
  .p-entete__mention {
    font-size: 8pt;
    color: #000000;
    border: 0.6pt solid #000000;
    display: inline-block;
    padding: 0.6mm 2mm;
    margin-top: 1.5mm;
  }

  /* --- identité --- */

  .p-identite {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4mm;
    margin-bottom: 4mm;
    break-inside: avoid;
  }
  .p-identite h3 {
    font-size: 8pt;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #333333;
    margin: 0 0 1mm;
    border-bottom: 0.4pt solid #bbbbbb;
    padding-bottom: 0.8mm;
  }
  .p-identite p { margin: 0 0 0.8mm; white-space: pre-line; }

  /* --- sections --- */

  .p-section { margin-bottom: 5mm; }
  .p-section > h2 {
    font-size: 10.5pt;

/* === 40-store.js === */
/* ------------------------------------------------------------------
   Store : état des dossiers, auto-save, export/import.
   Ne connaît ni le DOM ni la mise en page.
   ------------------------------------------------------------------ */

(function () {
  var CLE = "potentia-loan:v1";
  var QUOTA_ESTIME = 5 * 1024 * 1024; /* borne basse usuelle de localStorage */

  var etat = { schemaVersion: PL.SCHEMA_VERSION, dossiers: {} };
  var abonnes = [];
  var derniereErreur = null;

  function charger() {
    var brut;
    try {
      brut = window.localStorage.getItem(CLE);
    } catch (e) {
      derniereErreur = "Stockage local indisponible. Les données ne seront pas conservées.";
      return;
    }
    if (!brut) return;
    try {
      var lu = JSON.parse(brut);
      if (lu && lu.dossiers) {
        etat.dossiers = lu.dossiers;
        etat.schemaVersion = lu.schemaVersion || PL.SCHEMA_VERSION;
      }
    } catch (e) {
      derniereErreur = "Données locales illisibles ; elles ont été conservées mais ignorées.";
    }
  }

  function sauver() {
    try {
      window.localStorage.setItem(CLE, JSON.stringify(etat));
      derniereErreur = null;
      return { ok: true };
    } catch (e) {
      var quota = e && (e.name === "QuotaExceededError" ||
        e.name === "NS_ERROR_DOM_QUOTA_REACHED" || e.code === 22);
      derniereErreur = quota
        ? "Stockage saturé : la dernière modification n'a pas pu être enregistrée. " +
          "Exportez puis archivez un dossier, ou supprimez des photos."
        : "Enregistrement impossible : " + (e && e.message ? e.message : "erreur inconnue");
      return { ok: false, erreur: derniereErreur };
    }
  }

  function notifier() {
    abonnes.forEach(function (cb) {
      try { cb(); } catch (e) { /* un abonné défaillant ne bloque pas les autres */ }
    });
  }

  /* --- progression ------------------------------------------------ */

  function compterSupports(dossier, mode) {
    var champ = mode === "sortie" ? "etatSortie" : "etatEntree";
    var total = 0, faits = 0;
    dossier.edl.pieces.forEach(function (p) {
      PL.SUPPORTS.forEach(function (s) {
        total++;
        if (p.supports[s.cle][champ]) faits++;
      });
    });
    return { total: total, faits: faits };
  }

  function compterMobilier(dossier, mode) {
    var champ = mode === "sortie" ? "etatSortie" : "etatEntree";
    var total = 0, faits = 0;
    dossier.mobilier.sections.forEach(function (sec) {
      sec.lignes.forEach(function (l) {
        total++;
        if (l.absent || l[champ]) faits++;
      });
    });
    return { total: total, faits: faits };
  }

  function compterRemplis(valeurs) {
    var total = valeurs.length, faits = 0;
    valeurs.forEach(function (v) { if (String(v == null ? "" : v).trim() !== "") faits++; });
    return { total: total, faits: faits };
  }

  PL.progression = function (dossier, mode) {
    var camp = dossier.campagnes[mode];
    var compteurs = dossier.edl.compteurs[mode];
    var identite = compterRemplis([
      dossier.logement.adresse, dossier.bailleur.nom, dossier.bailleur.adresse,
      dossier.locataire.nom, camp.date, camp.lieu
    ]);
    var compteursCpt = compterRemplis(PL.DEFAULTS.compteurs.map(function (m) {
      return compteurs[m.cle].valeur;
    }));
    var chauffage = compterRemplis([dossier.edl.chauffage.mode, dossier.edl.chauffage.energie]);
    var equipTotal = 0, equipFaits = 0;
    Object.keys(dossier.edl.equipements).forEach(function (bloc) {
      dossier.edl.equipements[bloc].forEach(function (eq) {
        equipTotal++;
        if (eq[mode === "sortie" ? "presentSortie" : "presentEntree"]) equipFaits++;
      });
    });
    var signatures = compterRemplis([
      camp.signatureBailleur || camp.nomBailleur,
      camp.signatureLocataire || camp.nomLocataire
    ]);

    var sections = {
      identite: identite,
      compteurs: compteursCpt,
      technique: chauffage,
      pieces: compterSupports(dossier, mode),
      equipements: { total: equipTotal, faits: equipFaits },
      mobilier: compterMobilier(dossier, mode),
      signatures: signatures
    };

    var total = 0, faits = 0;
    /* les équipements sont des cases facultatives : hors du calcul global */
    ["identite", "compteurs", "technique", "pieces", "mobilier", "signatures"]
      .forEach(function (k) { total += sections[k].total; faits += sections[k].faits; });

    sections.global = {
      total: total,
      faits: faits,
      pourcent: total ? Math.round((faits / total) * 100) : 0
    };
    return sections;
  };

  /* --- validation d'import ---------------------------------------- */

  function valider(objet) {
    if (!objet || typeof objet !== "object") return "Fichier illisible.";
    if (!objet.schemaVersion) return "Fichier non reconnu : version de schéma absente.";
    if (objet.schemaVersion > PL.SCHEMA_VERSION) {
      return "Ce dossier a été créé avec une version plus récente de Potentia Loan.";
    }
    var requis = ["logement", "bailleur", "locataire", "campagnes", "edl", "mobilier"];
    for (var i = 0; i < requis.length; i++) {
      if (!objet[requis[i]]) return "Structure incomplète : section « " + requis[i] + " » manquante.";
    }
    if (!Array.isArray(objet.edl.pieces) || !Array.isArray(objet.mobilier.sections)) {
      return "Structure incomplète : pièces ou sections d'inventaire absentes.";
    }
    return null;
  }

  /* Complète un dossier importé ou ancien avec les champs manquants,
     sans jamais écraser une valeur existante. */
  function migrer(dossier) {
    var modele = PL.nouveauDossier();
    function fusion(cible, ref) {
      Object.keys(ref).forEach(function (k) {
        if (cible[k] === undefined || cible[k] === null) {
          cible[k] = ref[k];
        } else if (
          typeof ref[k] === "object" && !Array.isArray(ref[k]) && ref[k] !== null &&
          typeof cible[k] === "object" && !Array.isArray(cible[k])
        ) {
          fusion(cible[k], ref[k]);
        }
      });
      return cible;
    }
    ["logement", "bailleur", "locataire", "campagnes", "observations"].forEach(function (k) {
      dossier[k] = fusion(dossier[k] || {}, modele[k]);
    });
    dossier.edl = fusion(dossier.edl || {}, {
      compteurs: modele.edl.compteurs,
      chauffage: modele.edl.chauffage,
      divers: modele.edl.divers,
      equipements: modele.edl.equipements
    });
    dossier.edl.pieces = (dossier.edl.pieces || []).map(function (p) {
      p.photos = p.photos || { entree: [], sortie: [] };
      p.supports = p.supports || {};
      PL.SUPPORTS.forEach(function (s) {
        p.supports[s.cle] = fusion(p.supports[s.cle] || {}, {
          revetement: "", etatEntree: null, etatSortie: null,
          remarqueEntree: "", remarqueSortie: ""
        });
      });
      if (!p.id) p.id = PL.uid();
      return p;
    });
    dossier.mobilier.sections.forEach(function (sec) {
      if (!sec.id) sec.id = PL.uid();
      sec.lignes = (sec.lignes || []).map(function (l) {
        l.photos = l.photos || { entree: [], sortie: [] };
        if (!l.id) l.id = PL.uid();
        return fusion(l, {
          libelle: "", qte: "", absent: false, etatEntree: null,
          etatSortie: null, observations: ""
        });
      });
    });
    dossier.schemaVersion = PL.SCHEMA_VERSION;
    return dossier;
  }

  /* --- titre lisible d'un dossier --------------------------------- */

  function titre(dossier) {
    var a = (dossier.logement.adresse || "").trim();
    if (a) return a.split("\n")[0];
    var l = (dossier.locataire.nom || "").trim();
    if (l) return "Dossier — " + l;
    return "Dossier sans adresse";
  }

  /* --- interface publique ------------------------------------------ */

  PL.store = {
    list: function () {
      return Object.keys(etat.dossiers)
        .map(function (id) {
          var d = etat.dossiers[id];
          return {
            id: id,
            titre: titre(d),
            locataire: (d.locataire.nom || "").trim(),
            modifieLe: d.modifieLe,
            archive: !!d.archive,
            signeEntree: !!d.campagnes.entree.signeLe,
            signeSortie: !!d.campagnes.sortie.signeLe,
            avancement: PL.progression(d, d.campagnes.sortie.signeLe ||
              d.campagnes.entree.signeLe ? "sortie" : "entree").global.pourcent
          };
        })
        .sort(function (a, b) { return (b.modifieLe || "").localeCompare(a.modifieLe || ""); });
    },

    get: function (id) { return etat.dossiers[id] || null; },

    create: function () {
      var d = PL.nouveauDossier();
      etat.dossiers[d.id] = d;
      sauver();
      notifier();
      return d.id;
    },

    patch: function (id, fn) {
      var d = etat.dossiers[id];
      if (!d) return { ok: false, erreur: "Dossier introuvable." };
      fn(d);
      d.modifieLe = new Date().toISOString();
      var res = sauver();
      notifier();
      return res;
    },

    remove: function (id) {
      var d = etat.dossiers[id];
      if (d && PL.photos) PL.photos.purgerDossier(d);
      delete etat.dossiers[id];
      sauver();
      notifier();
    },

    duplicate: function (id) {
      var src = etat.dossiers[id];
      if (!src) return null;
      var copie = JSON.parse(JSON.stringify(src));
      copie.id = PL.uid();
      copie.creeLe = copie.modifieLe = new Date().toISOString();
      copie.campagnes.entree.signeLe = null;
      copie.campagnes.entree.verrouille = false;
      copie.campagnes.entree.signatureBailleur = "";
      copie.campagnes.entree.signatureLocataire = "";
      copie.campagnes.sortie = JSON.parse(JSON.stringify(copie.campagnes.entree));
      etat.dossiers[copie.id] = copie;
      sauver();
      notifier();
      return copie.id;
    },

    /* Le fichier embarque les photos : sans elles, un dossier rouvert sur un
       autre appareil perdrait ses clichés d'entrée, et donc la comparaison
       avant/après du récapitulatif des écarts. */
    construireFichier: function (id) {
      var d = etat.dossiers[id];
      if (!d) return Promise.reject(new Error("Dossier introuvable."));

      var ids = PL.photos.idsDuDossier(d);
      return Promise.all(ids.map(function (pid) {
        return PL.photos.get(pid).then(function (data) {
          return data ? [pid, data] : null;
        });
      })).then(function (paires) {
        var copie = JSON.parse(JSON.stringify(d));
        copie.photosIncluses = {};
        paires.filter(Boolean).forEach(function (p) { copie.photosIncluses[p[0]] = p[1]; });

        var nom = "potentia-loan-" +
          titre(d).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48) +
          ".json";
        return {
          nom: nom === "potentia-loan-.json" ? "potentia-loan.json" : nom,
          blob: new Blob([JSON.stringify(copie, null, 2)], { type: "application/json" }),
          photos: paires.filter(Boolean).length,
          titre: titre(d)
        };
      });
    },

    exportJSON: function (id) {
      return PL.store.construireFichier(id).then(function (f) {
        var url = URL.createObjectURL(f.blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = f.nom;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        return { ok: true, photos: f.photos, octets: f.blob.size, methode: "telechargement" };
      }).catch(function (e) {
        return { ok: false, erreur: e.message };
      });
    },

    /* Partage natif : le dossier part directement vers une messagerie, sans
       que l'utilisateur ait à retrouver un fichier dans ses téléchargements.
       Indisponible sur la plupart des navigateurs de bureau : on retombe
       alors sur le téléchargement, qui reste fonctionnel. */
    /* Chrome pour ordinateur expose navigator.share mais refuse les fichiers :
       tester la seule présence de l'API ferait annoncer « Envoyer » à un bouton
       qui télécharge. On teste donc la capacité réelle, avec un fichier témoin. */
    partageDisponible: function () {
      if (!navigator.share || !navigator.canShare) return false;
      try {
        return navigator.canShare({
          files: [new File(["{}"], "test.json", { type: "application/json" })]
        });
      } catch (e) {
        return false;
      }
    },

    partager: function (id) {
      return PL.store.construireFichier(id).then(function (f) {
        var fichier;
        try {
          fichier = new File([f.blob], f.nom, { type: "application/json" });
        } catch (e) {
          return PL.store.exportJSON(id);
        }
        if (!PL.store.partageDisponible() || !navigator.canShare({ files: [fichier] })) {
          return PL.store.exportJSON(id);
        }
        return navigator.share({
          files: [fichier],
          title: "Constat locatif — " + f.titre,
          text: "Dossier Potentia Loan « " + f.titre + " ». " +
            "Pour l'ouvrir : " + window.location.origin + window.location.pathname +
            " puis « Importer un JSON »."
        }).then(function () {
          return { ok: true, photos: f.photos, octets: f.blob.size, methode: "partage" };
        }).catch(function (e) {
          /* l'utilisateur a fermé la feuille de partage : ce n'est pas une erreur */
          if (e && e.name === "AbortError") return { ok: true, annule: true };
          return PL.store.exportJSON(id);
        });
      }).catch(function (e) {
        return { ok: false, erreur: e.message };
      });
    },

    importJSON: function (texte) {
      var objet;
      try {
        objet = JSON.parse(texte);
      } catch (e) {
        return { ok: false, erreur: "Ce fichier n'est pas un JSON valide." };
      }
      var erreur = valider(objet);
      if (erreur) return { ok: false, erreur: erreur };

      /* Photos embarquées : réinjectées dans IndexedDB sous leur identifiant
         d'origine, pour que les références du dossier restent valides. */
      var photos = objet.photosIncluses || {};
      delete objet.photosIncluses;
      var nbPhotos = Object.keys(photos).length;
      Object.keys(photos).forEach(function (pid) {
        PL.photos.restaurer(pid, photos[pid]);
      });

      var dossier = migrer(objet);
      if (!dossier.id || etat.dossiers[dossier.id]) dossier.id = PL.uid();
      dossier.modifieLe = new Date().toISOString();
      etat.dossiers[dossier.id] = dossier;
      var res = sauver();
      if (!res.ok) {
        delete etat.dossiers[dossier.id];
        return { ok: false, erreur: res.erreur };
      }
      notifier();
      return { ok: true, id: dossier.id, photos: nbPhotos };
    },

    usage: function () {
      var octets = 0;
      try {
        var brut = window.localStorage.getItem(CLE);
        octets = brut ? new Blob([brut]).size : 0;
      } catch (e) { octets = 0; }
      return {
        octets: octets,
        pourcent: Math.min(100, Math.round((octets / QUOTA_ESTIME) * 100))
      };
    },

    erreur: function () { return derniereErreur; },

    onChange: function (cb) {
      abonnes.push(cb);
      return function () {
        var i = abonnes.indexOf(cb);
        if (i >= 0) abonnes.splice(i, 1);
      };
    }
  };

  charger();
})();


/* === 45-photos.js === */
/* ------------------------------------------------------------------
   Photos : compression <canvas> + stockage IndexedDB.
   localStorage est trop étroit pour des images ; IndexedDB accepte
   plusieurs centaines de mégaoctets.
   ------------------------------------------------------------------ */

(function () {
  var NOM_BASE = "potentia-loan-photos";
  var MAGASIN = "photos";
  var COTE_MAX = 1280;
  var QUALITE = 0.72;

  var basePromesse = null;
  var supporte = true;
  var cache = {}; /* id -> dataURL, pour éviter de relire à chaque rendu */

  function ouvrir() {
    if (basePromesse) return basePromesse;
    basePromesse = new Promise(function (resoudre, rejeter) {
      if (!window.indexedDB) { supporte = false; rejeter(new Error("IndexedDB absent")); return; }
      var req;
      try {
        req = window.indexedDB.open(NOM_BASE, 1);
      } catch (e) { supporte = false; rejeter(e); return; }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(MAGASIN)) {
          db.createObjectStore(MAGASIN, { keyPath: "id" });
        }
      };
      req.onsuccess = function () { resoudre(req.result); };
      req.onerror = function () { supporte = false; rejeter(req.error || new Error("IndexedDB refusé")); };
      req.onblocked = function () { rejeter(new Error("IndexedDB bloqué")); };
    });
    return basePromesse;
  }

  function transaction(mode, action) {
    return ouvrir().then(function (db) {
      return new Promise(function (resoudre, rejeter) {
        var tx = db.transaction(MAGASIN, mode);
        var magasin = tx.objectStore(MAGASIN);
        var resultat;
        try { resultat = action(magasin); } catch (e) { rejeter(e); return; }
        tx.oncomplete = function () {
          resoudre(resultat && resultat.result !== undefined ? resultat.result : resultat);
        };
        tx.onerror = function () { rejeter(tx.error); };
        tx.onabort = function () { rejeter(tx.error || new Error("Transaction interrompue")); };
      });
    });
  }

  function chargerImage(fichier) {
    if (window.createImageBitmap) {
      return window.createImageBitmap(fichier, { imageOrientation: "from-image" })
        .catch(function () { return chargerViaBalise(fichier); });
    }
    return chargerViaBalise(fichier);
  }

  function chargerViaBalise(fichier) {
    return new Promise(function (resoudre, rejeter) {
      var url = URL.createObjectURL(fichier);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resoudre(img); };
      img.onerror = function () { URL.revokeObjectURL(url); rejeter(new Error("Image illisible")); };
      img.src = url;
    });
  }

  function compresser(fichier) {
    return chargerImage(fichier).then(function (source) {
      var l = source.width || source.naturalWidth;
      var h = source.height || source.naturalHeight;
      if (!l || !h) throw new Error("Dimensions d'image inconnues");
      var ratio = Math.min(1, COTE_MAX / Math.max(l, h));
      var largeur = Math.max(1, Math.round(l * ratio));
      var hauteur = Math.max(1, Math.round(h * ratio));
      var canvas = document.createElement("canvas");
      canvas.width = largeur;
      canvas.height = hauteur;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, largeur, hauteur);
      ctx.drawImage(source, 0, 0, largeur, hauteur);
      if (source.close) source.close();
      return new Promise(function (resoudre) {
        if (canvas.toBlob) {
          canvas.toBlob(function (blob) {
            resoudre({ blob: blob, largeur: largeur, hauteur: hauteur });
          }, "image/jpeg", QUALITE);
        } else {
          var dataURL = canvas.toDataURL("image/jpeg", QUALITE);
          resoudre({ dataURL: dataURL, largeur: largeur, hauteur: hauteur });
        }
      });
    });
  }

  function blobVersDataURL(blob) {
    return new Promise(function (resoudre, rejeter) {
      var fr = new FileReader();
      fr.onload = function () { resoudre(fr.result); };
      fr.onerror = function () { rejeter(fr.error); };
      fr.readAsDataURL(blob);
    });
  }

  PL.photos = {
    disponible: function () {
      return ouvrir().then(function () { return true; }).catch(function () { return false; });
    },

    supporteSync: function () { return supporte; },

    put: function (fichier) {
      return compresser(fichier).then(function (r) {
        var id = PL.uid();
        var enregistrement = {
          id: id,
          largeur: r.largeur,
          hauteur: r.hauteur,
          creeLe: new Date().toISOString()
        };
        if (r.blob) {
          enregistrement.blob = r.blob;
          enregistrement.octets = r.blob.size;
        } else {
          enregistrement.dataURL = r.dataURL;
          enregistrement.octets = Math.round(r.dataURL.length * 0.75);
        }
        return transaction("readwrite", function (m) { m.put(enregistrement); })
          .then(function () {
            return {
              id: id,
              largeur: r.largeur,
              hauteur: r.hauteur,
              octets: enregistrement.octets
            };
          });
      });
    },

    get: function (id) {
      if (cache[id]) return Promise.resolve(cache[id]);
      return transaction("readonly", function (m) { return m.get(id); })
        .then(function (enr) {
          if (!enr) return null;
          if (enr.dataURL) { cache[id] = enr.dataURL; return enr.dataURL; }
          return blobVersDataURL(enr.blob).then(function (d) { cache[id] = d; return d; });
        })
        .catch(function () { return null; });
    },

    del: function (id) {
      delete cache[id];
      return transaction("readwrite", function (m) { m.delete(id); }).catch(function () {});
    },

    usage: function () {
      return transaction("readonly", function (m) { return m.getAll(); })
        .then(function (tout) {
          return (tout || []).reduce(function (somme, e) { return somme + (e.octets || 0); }, 0);
        })
        .catch(function () { return 0; });
    },

    /* Réinsère une photo sous un identifiant imposé (restauration d'import). */
    restaurer: function (id, dataURL) {
      cache[id] = dataURL;
      return transaction("readwrite", function (m) {
        m.put({
          id: id, dataURL: dataURL,
          octets: Math.round(dataURL.length * 0.75),
          creeLe: new Date().toISOString()
        });
      }).catch(function () {});
    },

    /* Identifiants des photos d'une campagne, ou des deux si `mode` est omis.
       C'est LA liste de référence des emplacements où une photo peut exister :
       tout code qui consomme des photos — l'impression au premier chef — doit
       couvrir les mêmes. Les photos de compteurs ont un jour été oubliées à
       l'impression parce que cette liste y était réécrite en double. */
    idsDuDossier: function (dossier, mode) {
      var campagnes = mode ? [mode] : ["entree", "sortie"];
      var ids = [];
      function collecter(bloc) {
        if (!bloc) return;
        campagnes.forEach(function (c) {
          (bloc[c] || []).forEach(function (p) { if (p && p.id) ids.push(p.id); });
        });
      }
      (dossier.edl.pieces || []).forEach(function (p) { collecter(p.photos); });
      (dossier.mobilier.sections || []).forEach(function (s) {
        (s.lignes || []).forEach(function (l) { collecter(l.photos); });
      });
      campagnes.forEach(function (c) {
        var cpt = dossier.edl.compteurs && dossier.edl.compteurs[c];
        if (!cpt) return;
        PL.DEFAULTS.compteurs.forEach(function (m) {
          ((cpt[m.cle] && cpt[m.cle].photos) || []).forEach(function (p) {
            if (p && p.id) ids.push(p.id);
          });
        });
      });
      return ids;
    },

    /* Supprime toutes les photos référencées par un dossier que l'on efface. */
    purgerDossier: function (dossier) {
      PL.photos.idsDuDossier(dossier).forEach(function (id) { PL.photos.del(id); });
    }
  };
})();


/* === 50-ui.js === */
/* ------------------------------------------------------------------
   Socle d'interface : fabrique d'éléments, composants de saisie,
   routeur, dialogues. Aucune connaissance du métier.
   ------------------------------------------------------------------ */

PL.el = function (tag, props) {
  var n = document.createElement(tag);
  var enfants = Array.prototype.slice.call(arguments, 2);
  if (props) {
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") n.className = v;
      else if (k === "texte") n.textContent = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") {
        n.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === "dataset") {
        Object.keys(v).forEach(function (d) { n.dataset[d] = v[d]; });
      } else if (k in n && k !== "list" && typeof v !== "object") {
        try { n[k] = v; } catch (e) { n.setAttribute(k, v); }
      } else {
        n.setAttribute(k, v === true ? "" : v);
      }
    });
  }
  enfants.forEach(function ajouter(c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(ajouter); return; }
    n.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  });
  return n;
};

PL.vider = function (n) { while (n.firstChild) n.removeChild(n.firstChild); return n; };

PL.annoncer = function (message) {
  var z = document.getElementById("zone-annonces");
  if (z) { z.textContent = ""; setTimeout(function () { z.textContent = message; }, 30); }
};

var minuteurToast = null;
PL.toast = function (message) {
  var ancien = document.querySelector(".toast");
  if (ancien) ancien.remove();
  var t = PL.el("div", { class: "toast", role: "status" }, message);
  document.body.appendChild(t);
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(function () { t.remove(); }, 3800);
};

/* --- champs -------------------------------------------------------- */

PL.champ = function (o) {
  var saisie;
  if (o.multiligne) {
    saisie = PL.el("textarea", {
      value: o.valeur || "", rows: o.rows || 3,
      placeholder: o.placeholder || "", disabled: !!o.lecture
    });
  } else {
    saisie = PL.el("input", {
      type: o.type || "text",
      value: o.valeur == null ? "" : o.valeur,
      inputmode: o.type === "number" ? "decimal" : null,
      placeholder: o.placeholder || "",
      list: o.liste || null,
      disabled: !!o.lecture
    });
  }
  saisie.addEventListener("input", function () { o.onChange(saisie.value); });
  var id = "c" + PL.uid().slice(0, 8);
  saisie.id = id;
  return PL.el("label", { class: "champ" + (o.large ? " champ--large" : ""), "for": id },
    PL.el("span", { class: "champ__label" }, o.label),
    PL.el("span", { class: "champ__saisie" },
      saisie,
      o.suffixe ? PL.el("span", { class: "champ__suffixe" }, o.suffixe) : null
    )
  );
};

PL.datalist = function (id, valeurs) {
  return PL.el("datalist", { id: id },
    valeurs.map(function (v) { return PL.el("option", { value: v }); }));
};

PL.caseACocher = function (o) {
  var input = PL.el("input", { type: "checkbox", checked: !!o.coche, disabled: !!o.lecture });
  var wrap = PL.el("label", { class: "case" + (o.coche ? " case--cochee" : "") },
    input, PL.el("span", null, o.label));
  input.addEventListener("change", function () {
    wrap.classList.toggle("case--cochee", input.checked);
    o.onChange(input.checked);
  });
  return wrap;
};

/* --- sélecteur d'état segmenté -------------------------------------- */

PL.segmente = function (o) {
  var groupe = PL.el("div", {
    class: "segmente" + (o.desactive ? " segmente--desactive" : ""),
    role: "radiogroup",
    "aria-label": o.label
  });
  var boutons = [];

  function majuscule(valeur) {
    boutons.forEach(function (b) {
      var actif = b.dataset.code === valeur;
      b.setAttribute("aria-checked", actif ? "true" : "false");
      b.tabIndex = actif || (!valeur && b === boutons[0]) ? 0 : -1;
    });
  }

  o.options.forEach(function (opt) {
    var b = PL.el("button", {
      type: "button", class: "segmente__opt", role: "radio",
      "aria-checked": "false", "aria-label": opt.libelle,
      title: opt.libelle, dataset: { code: opt.code }, disabled: !!o.lecture
    }, opt.code);
    b.addEventListener("click", function () {
      var nouvelle = o.valeur === opt.code && o.effacable !== false ? null : opt.code;
      o.valeur = nouvelle;
      majuscule(nouvelle);
      o.onChange(nouvelle);
    });
    b.addEventListener("keydown", function (e) {
      var i = boutons.indexOf(b), suivant = null;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") suivant = boutons[(i + 1) % boutons.length];
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") suivant = boutons[(i - 1 + boutons.length) % boutons.length];
      if (suivant) { e.preventDefault(); suivant.focus(); suivant.click(); }
    });
    boutons.push(b);
    groupe.appendChild(b);
  });

  majuscule(o.valeur);
  return groupe;
};

PL.etatLecture = function (code, prefixe) {
  return PL.el("span", { class: "etat-lecture" },
    PL.el("span", null, prefixe || "Entrée :"),
    PL.el("span", { class: "etat-lecture__pastille" }, code || "—"));
};

/* --- dialogues ------------------------------------------------------ */

PL.dialogue = function (o) {
  var calque = PL.el("div", { class: "calque" });
  var boite = PL.el("div", {
    class: "dialogue", role: "dialog", "aria-modal": "true", "aria-label": o.titre
  });
  var focusPrecedent = document.activeElement;

  function fermer() {
    calque.remove();
    document.removeEventListener("keydown", surTouche);
    if (focusPrecedent && focusPrecedent.focus) focusPrecedent.focus();
  }
  function surTouche(e) {
    if (e.key === "Escape") { e.preventDefault(); fermer(); }
    if (e.key === "Tab") {
      var cibles = boite.querySelectorAll("button, input, textarea, select, [href]");
      if (!cibles.length) return;
      var premier = cibles[0], dernier = cibles[cibles.length - 1];
      if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
      else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }
    }
  }

  boite.appendChild(PL.el("h2", { class: "dialogue__titre" }, o.titre));
  if (o.corps) boite.appendChild(o.corps);
  var actions = PL.el("div", { class: "dialogue__actions" });
  (o.actions || []).forEach(function (a) {
    actions.appendChild(PL.el("button", {
      type: "button",
      class: "btn" + (a.principal ? " btn--principal" : "") + (a.danger ? " btn--danger" : ""),
      onclick: function () { if (!a.onClick || a.onClick() !== false) fermer(); }
    }, a.libelle));
  });
  boite.appendChild(actions);
  calque.appendChild(boite);
  calque.addEventListener("mousedown", function (e) { if (e.target === calque) fermer(); });
  document.addEventListener("keydown", surTouche);
  document.getElementById("calque-dialogues").appendChild(calque);

  var premierChamp = boite.querySelector("input, textarea, button");
  if (premierChamp) premierChamp.focus();
  return { fermer: fermer };
};

PL.confirmer = function (o) {
  return new Promise(function (resoudre) {
    PL.dialogue({
      titre: o.titre,
      corps: PL.el("p", null, o.message),
      actions: [
        { libelle: o.annuler || "Annuler", onClick: function () { resoudre(false); } },
        {
          libelle: o.valider || "Confirmer", principal: !o.danger, danger: !!o.danger,
          onClick: function () { resoudre(true); }
        }
      ]
    });
  });
};

PL.demanderTexte = function (o) {
  return new Promise(function (resoudre) {
    var valeur = o.valeur || "";
    var corps = PL.champ({
      label: o.label, valeur: valeur, large: true,
      onChange: function (v) { valeur = v; }
    });
    PL.dialogue({
      titre: o.titre,
      corps: corps,
      actions: [
        { libelle: "Annuler", onClick: function () { resoudre(null); } },
        {
          libelle: o.valider || "Valider", principal: true,
          onClick: function () { resoudre(valeur.trim() || null); }
        }
      ]
    });
  });
};

/* --- routeur -------------------------------------------------------- */

(function () {
  var routes = [];
  var rendus = 0;

  function analyser(hash) {
    var chemin = (hash || "").replace(/^#/, "");
    if (!chemin || chemin === "/") return { segments: [] };
    return { segments: chemin.replace(/^\//, "").split("/").map(decodeURIComponent) };
  }

  function apparier(motif, segments) {
    var parts = motif.replace(/^\//, "").split("/").filter(Boolean);
    if (motif === "/" && segments.length === 0) return {};
    if (parts.length !== segments.length) return null;
    var params = {};
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].charAt(0) === ":") params[parts[i].slice(1)] = segments[i];
      else if (parts[i] !== segments[i]) return null;
    }
    return params;
  }

  function rendre() {
    var vue = document.getElementById("vue");
    var segments = analyser(window.location.hash).segments;
    for (var i = 0; i < routes.length; i++) {
      var params = apparier(routes[i].motif, segments);
      if (params) {
        PL.vider(vue);
        var contenu;
        try {
          contenu = routes[i].rendu(params);
        } catch (e) {
          contenu = PL.el("div", { class: "note note--alerte" },
            "Erreur d'affichage : " + (e && e.message ? e.message : e));
          if (window.console) window.console.error(e);
        }
        if (contenu) vue.appendChild(contenu);
        if (rendus++) vue.focus();
        window.scrollTo(0, 0);
        return;
      }
    }
    window.location.hash = "#/";
  }

  PL.router = {
    define: function (motif, rendu) { routes.push({ motif: motif, rendu: rendu }); },
    go: function (chemin) {
      if (("#" + chemin) === window.location.hash) rendre();
      else window.location.hash = "#" + chemin;
    },
    rafraichir: rendre,
    demarrer: function () {
      window.addEventListener("hashchange", rendre);
      rendre();
    }
  };
})();

/* --- bloc photos ----------------------------------------------------- */

PL.blocPhotos = function (o) {
  /* o : { liste, onChange(liste), lecture, label } */
  var conteneur = PL.el("div", { class: "photos" });
  var grille = PL.el("div", { class: "photos__grille" });

  function peindre() {
    PL.vider(grille);
    (o.liste || []).forEach(function (ref) {
      var vignette = PL.el("div", { class: "photo-vignette" });
      PL.photos.get(ref.id).then(function (data) {
        if (!data) {
          vignette.appendChild(PL.el("span", { class: "champ__label" }, "image absente"));
          return;
        }
        vignette.insertBefore(
          PL.el("img", { src: data, alt: ref.legende || "Photo du constat" }),
          vignette.firstChild
        );
      });
      if (!o.lecture) {
        vignette.appendChild(PL.el("button", {
          type: "button", class: "photo-vignette__suppr",
          "aria-label": "Supprimer cette photo",
          onclick: function () {
            PL.photos.del(ref.id);
            o.liste.splice(o.liste.indexOf(ref), 1);
            o.onChange(o.liste);
            peindre();
          }
        }, "×"));
      }
      grille.appendChild(vignette);
    });
  }

  conteneur.appendChild(grille);

  if (!o.lecture) {
    var input = PL.el("input", {
      type: "file", accept: "image/*", capture: "environment", multiple: true
    });
    input.addEventListener("change", function () {
      var fichiers = Array.prototype.slice.call(input.files || []);
      input.value = "";
      if (!fichiers.length) return;
      PL.toast(fichiers.length > 1 ? "Traitement des photos…" : "Traitement de la photo…");
      fichiers.reduce(function (chaine, f) {
        return chaine.then(function () {
          return PL.photos.put(f).then(function (meta) {
            o.liste.push({ id: meta.id, legende: "" });
          });
        });
      }, Promise.resolve())
        .then(function () { o.onChange(o.liste); peindre(); PL.toast("Photo enregistrée."); })
        .catch(function (e) {
          PL.toast("Photo non enregistrée : " + (e && e.message ? e.message : "erreur"));
        });
    });
    var bouton = PL.el("button", {
      type: "button", class: "btn btn--petit",
      onclick: function () { input.click(); }
    }, "Ajouter une photo");
    conteneur.appendChild(PL.el("div", { class: "photo-ajout" }, input, bouton));
  }

  peindre();
  return conteneur;
};

/* --- utilitaires d'affichage ---------------------------------------- */

PL.formaterDate = function (iso) {
  if (!iso) return "—";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", {
    hour: "2-digit", minute: "2-digit"
  });
};

PL.formaterOctets = function (o) {
  if (o < 1024) return o + " o";
  if (o < 1024 * 1024) return Math.round(o / 1024) + " Ko";
  return (o / (1024 * 1024)).toFixed(1) + " Mo";
};

PL.dateJour = function () {
  var d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
};

PL.dateFr = function (isoCourt) {
  if (!isoCourt) return "";
  var p = String(isoCourt).split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : isoCourt;
};

PL.vues = PL.vues || {};

PL.SECTIONS = [
  { cle: "identite", titre: "Identité", sous: "Logement, bailleur, locataire" },
  { cle: "compteurs", titre: "Compteurs", sous: "Relevés eau, gaz, électricité" },
  { cle: "technique", titre: "Chauffage & divers", sous: "Chauffage, clés, sécurité" },
  { cle: "pieces", titre: "Pièces", sous: "Plafond, murs, sol" },

  { cle: "mobilier", titre: "Inventaire mobilier", sous: "Annexe du bail meublé" },
  { cle: "signatures", titre: "Signatures", sous: "Lu et approuvé" }
];

PL.estVerrouille = function (dossier, mode) {
  return !!dossier.campagnes[mode].verrouille;
};

PL.libelleMode = function (mode) {
  return mode === "sortie" ? "Sortie" : "Entrée";
};

/* « de entrée » est fautif : l'élision se fait devant la voyelle. */
PL.deMode = function (mode) {
  return mode === "sortie" ? "de sortie" : "d'entrée";
};

/* Bouton d'envoi du dossier. Un seul bouton, dont le libellé suit ce que
   l'appareil sait faire : partage natif sur mobile et tablette, simple
   téléchargement ailleurs. Deux boutons distincts feraient doublon sur les
   appareils où le partage n'existe pas. */
PL.boutonEnvoi = function (id, classe) {
  var partage = PL.store.partageDisponible();
  var bouton = PL.el("button", {
    type: "button", class: classe || "btn btn--petit",
    onclick: function () {
      bouton.disabled = true;
      PL.toast("Préparation du dossier…");
      (partage ? PL.store.partager(id) : PL.store.exportJSON(id)).then(function (r) {
        bouton.disabled = false;
        if (!r || !r.ok) {
          PL.toast("Envoi impossible : " + ((r && r.erreur) || "erreur inconnue"));
          return;
        }
        if (r.annule) return;
        PL.toast((r.methode === "partage" ? "Dossier envoyé" : "Dossier téléchargé") +
          " — " + r.photos + " photo(s), " + PL.formaterOctets(r.octets) + ".");
      });
    }
  }, partage ? "Envoyer le dossier" : "Exporter le dossier");
  return bouton;
};

/* En-tête commun aux vues d'une section de dossier. */
PL.enteteDossier = function (dossier, mode, section) {
  var verrou = PL.estVerrouille(dossier, mode);
  var i = PL.SECTIONS.findIndex(function (s) { return s.cle === section.cle; });
  var precedent = PL.SECTIONS[i - 1];
  var suivant = PL.SECTIONS[i + 1];
  var base = "/d/" + dossier.id + "/" + mode + "/";

  return PL.el("div", null,
    PL.el("div", { class: "vue-entete" },
      PL.el("div", { class: "vue-entete__texte" },
        PL.el("div", { class: "vue-entete__sur" },
          PL.libelleMode(mode) + " · " + (dossier.logement.adresse || "adresse non renseignée")),
        PL.el("h1", null, section.titre)
      ),
      PL.el("div", { class: "app-entete__actions" },
        precedent ? PL.el("button", {
          type: "button", class: "btn btn--petit",
          onclick: function () { PL.router.go(base + precedent.cle); }
        }, "‹ " + precedent.titre) : null,
        suivant ? PL.el("button", {
          type: "button", class: "btn btn--petit",
          onclick: function () { PL.router.go(base + suivant.cle); }
        }, suivant.titre + " ›") : null,
        PL.el("button", {
          type: "button", class: "btn btn--petit",
          onclick: function () { PL.router.go("/d/" + dossier.id + "/" + mode); }
        }, "Sommaire")
      )
    ),
    verrou ? PL.el("div", { class: "note note--alerte" },
      "Ce constat " + PL.deMode(mode) +
      " est signé et verrouillé. Les champs sont en lecture seule.") : null
  );
};

/* Pied de navigation identique en bas de chaque section. */
PL.piedNavigation = function (dossier, mode, section) {
  var i = PL.SECTIONS.findIndex(function (s) { return s.cle === section.cle; });
  var suivant = PL.SECTIONS[i + 1];
  var base = "/d/" + dossier.id + "/" + mode + "/";
  return PL.el("div", { class: "barre-actions" },
    PL.el("button", {
      type: "button", class: "btn",
      onclick: function () { PL.router.go("/d/" + dossier.id + "/" + mode); }
    }, "Retour au sommaire"),
    suivant ? PL.el("button", {
      type: "button", class: "btn btn--principal",
      onclick: function () { PL.router.go(base + suivant.cle); }
    }, "Continuer : " + suivant.titre) : null
  );
};

/* --- accueil --------------------------------------------------------- */

PL.vues.accueil = function () {
  var racine = PL.el("div", null);
  var dossiers = PL.store.list();
  var actifs = dossiers.filter(function (d) { return !d.archive; });
  var archives = dossiers.filter(function (d) { return d.archive; });

  racine.appendChild(PL.el("div", { class: "vue-entete" },
    PL.el("div", { class: "vue-entete__texte" },
      PL.el("div", { class: "vue-entete__sur" }, "Constats locatifs"),
      PL.el("h1", null, "Mes dossiers")
    ),
    PL.el("div", { class: "app-entete__actions" },
      PL.el("button", {
        type: "button", class: "btn btn--principal",
        onclick: function () {
          var id = PL.store.create();
          PL.router.go("/d/" + id + "/entree/identite");
        }
      }, "Nouveau dossier"),
      boutonImport()
    )
  ));

  var erreur = PL.store.erreur();
  if (erreur) racine.appendChild(PL.el("div", { class: "note note--alerte" }, erreur));

  if (!actifs.length && !archives.length) {
    racine.appendChild(PL.el("div", { class: "etat-vide" },
      PL.el("p", null, "Aucun dossier pour le moment."),
      PL.el("p", null,
        "Créez un dossier pour établir un état des lieux d'entrée, " +
        "ou importez un dossier existant au format JSON.")
    ));
  } else {
    racine.appendChild(liste(actifs));
    if (archives.length) {
      racine.appendChild(PL.el("h2", { style: "margin:22px 0 10px" },
        "Archivés (" + archives.length + ")"));
      racine.appendChild(liste(archives));
    }
  }

  racine.appendChild(blocStockage());
  racine.appendChild(PL.el("div", { class: "note" },
    "Les dossiers sont enregistrés dans ce navigateur uniquement. " +
    "Exportez-les en JSON pour les sauvegarder ou les transférer sur un autre appareil."));

  return racine;

  function liste(items) {
    var ul = PL.el("div", { class: "liste-dossiers" });
    items.forEach(function (d) { ul.appendChild(ligne(d)); });
    return ul;
  }

  function ligne(d) {
    var badges = PL.el("span", null,
      d.signeEntree ? PL.el("span", { class: "badge badge--signe" }, "Entrée signée") : null,
      " ",
      d.signeSortie ? PL.el("span", { class: "badge badge--sortie" }, "Sortie signée") : null
    );
    return PL.el("div", { class: "dossier-ligne" },
      PL.el("div", { class: "dossier-ligne__info" },
        PL.el("div", { class: "dossier-ligne__titre" }, d.titre),
        PL.el("div", { class: "dossier-ligne__meta" },
          (d.locataire ? d.locataire + " · " : "") +
          "modifié le " + PL.formaterDate(d.modifieLe) + " · " + d.avancement + " %"),
        badges
      ),
      PL.el("div", { class: "dossier-ligne__actions" },
        PL.el("button", {
          type: "button", class: "btn btn--petit btn--principal",
          onclick: function () {
            PL.router.go("/d/" + d.id + "/" + (d.signeEntree ? "sortie" : "entree"));
          }
        }, d.signeEntree ? "Ouvrir (sortie)" : "Ouvrir"),
        PL.boutonEnvoi(d.id),
        PL.el("button", {
          type: "button", class: "btn btn--petit",
          onclick: function () {
            PL.store.duplicate(d.id);
            PL.toast("Dossier dupliqué.");
            PL.router.rafraichir();
          }
        }, "Dupliquer"),
        PL.el("button", {
          type: "button", class: "btn btn--petit",
          onclick: function () {
            PL.store.patch(d.id, function (x) { x.archive = !x.archive; });
            PL.router.rafraichir();
          }
        }, d.archive ? "Désarchiver" : "Archiver"),
        PL.el("button", {
          type: "button", class: "btn btn--petit btn--danger",
          onclick: function () {
            PL.confirmer({
              titre: "Supprimer ce dossier ?",
              message: "« " + d.titre + " » et ses photos seront définitivement effacés " +
                "de cet appareil. Cette action est irréversible. Pensez à exporter le " +
                "dossier avant si vous souhaitez le conserver.",
              valider: "Supprimer définitivement", danger: true
            }).then(function (ok) {
              if (!ok) return;
              PL.store.remove(d.id);
              PL.toast("Dossier supprimé.");
              PL.router.rafraichir();
            });
          }
        }, "Supprimer")
      )
    );
  }

  function boutonImport() {
    var input = PL.el("input", { type: "file", accept: "application/json,.json" });
    input.style.display = "none";
    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      input.value = "";
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        var res = PL.store.importJSON(String(fr.result));
        if (res.ok) {
          PL.toast("Dossier importé" +
            (res.photos ? " — " + res.photos + " photo(s) restaurée(s)." : "."));
          PL.router.go("/d/" + res.id + "/entree");
        } else {
          PL.dialogue({
            titre: "Import impossible",
            corps: PL.el("p", null, res.erreur),
            actions: [{ libelle: "Fermer", principal: true }]
          });
        }
      };
      fr.readAsText(f);
    });
    var b = PL.el("button", {
      type: "button", class: "btn", onclick: function () { input.click(); }
    }, "Importer un JSON");
    return PL.el("span", null, input, b);
  }

  function blocStockage() {
    var u = PL.store.usage();
    var bloc = PL.el("div", { class: "carte carte--sourde", style: "margin-top:22px" },
      PL.el("div", { class: "carte__entete" },
        PL.el("strong", null, "Stockage de cet appareil"),
        PL.el("span", { class: "dossier-ligne__meta" },
          "Données : " + PL.formaterOctets(u.octets))
      ),
      PL.el("div", { class: "jauge" },
        PL.el("div", {
          class: "jauge__barre" + (u.pourcent > 80 ? " jauge__barre--alerte" : ""),
          style: "width:" + Math.max(2, u.pourcent) + "%"
        })
      )
    );
    PL.photos.usage().then(function (octets) {
      bloc.appendChild(PL.el("div", { class: "dossier-ligne__meta", style: "margin-top:6px" },
        "Photos : " + PL.formaterOctets(octets) + " (stockées séparément, sans limite étroite)"));
    });
    return bloc;
  }
};

PL.maj = function (dossier, fn) {
  var res = PL.store.patch(dossier.id, fn);
  if (!res.ok && res.erreur) PL.toast(res.erreur);
};

PL.vues.identite = function (dossier, mode) {
  var lecture = PL.estVerrouille(dossier, mode);
  var camp = dossier.campagnes[mode];
  var section = PL.SECTIONS[0];

  function champ(label, objet, cle, options) {
    var o = options || {};
    return PL.champ({
      label: label, valeur: objet[cle], lecture: lecture,
      type: o.type, suffixe: o.suffixe, multiligne: o.multiligne,
      large: o.large, placeholder: o.placeholder,
      onChange: function (v) { PL.maj(dossier, function () { objet[cle] = v; }); }
    });

  if (!camp.date) {
    PL.maj(dossier, function (d) { d.campagnes[mode].date = PL.dateJour(); });
  }

  return PL.el("div", null,
    PL.enteteDossier(dossier, mode, section),

        champ("Escalier", dossier.logement, "escalier"),
        champ("Étage", dossier.logement, "etage"),
        champ("Porte", dossier.logement, "porte")

    ),

    PL.el("section", { class: "carte" },
      PL.el("div", { class: "carte__entete" }, PL.el("h2", null, "Bailleur")),
      PL.el("div", { class: "grille-champs" },
        champ("Nom ou désignation", dossier.bailleur, "nom", { large: true }),
        champ("Adresse", dossier.bailleur, "adresse", { multiligne: true, large: true })
      )
    ),

    PL.el("section", { class: "carte" },
      PL.el("div", { class: "carte__entete" }, PL.el("h2", null, "Locataire")),
      PL.el("div", { class: "grille-champs" },
        champ("Nom", dossier.locataire, "nom", { large: true }),
        champ("Adresse à l'entrée", dossier.locataire, "adresseEntree", { multiligne: true }),

          { multiligne: true })
      )

    PL.el("section", { class: "carte" },
      PL.el("div", { class: "carte__entete" },
        PL.el("h2", null, "Constat " + PL.deMode(mode))),
      PL.el("div", { class: "grille-champs" },
        champ("Date du constat", camp, "date", { type: "date" }),
        champ("Fait à", camp, "lieu", { placeholder: "Commune" }),
        champ("Nombre d'exemplaires originaux", camp, "nbExemplaires", { type: "number" })
      )
    ),

    PL.piedNavigation(dossier, mode, section)
  );
};

PL.vues.compteurs = function (dossier, mode) {

  var entree = dossier.edl.compteurs.entree;

      PL.el("h2", null, "Relevé des compteurs"),
      PL.el("span", { class: "dossier-ligne__meta" }, "Relevé au jour du constat")
    )
  );

  PL.DEFAULTS.compteurs.forEach(function (m) {
    var cpt = courants[m.cle];
    var bloc = PL.el("div", { class: "constat-ligne" },
      PL.el("div", { class: "constat-grille" },
        PL.champ({
          label: m.libelle, valeur: cpt.valeur, suffixe: m.unite,
          type: "number", lecture: lecture,
