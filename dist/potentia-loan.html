        }),
        mode === "sortie"
          ? PL.el("div", { class: "champ" },
              PL.el("span", { class: "champ__label" }, "Relevé d'entrée"),
              PL.el("div", { style: "min-height:44px;display:flex;align-items:center" },
                (entree[m.cle].valeur || "—") + " " + m.unite))
          : null
      ),
      PL.blocPhotos({
        liste: cpt.photos, lecture: lecture,
        onChange: function () { PL.maj(dossier, function () {}); }
      })
    );
    corps.appendChild(bloc);
  });

  var libres = PL.el("div", null);
  function peindreLibres() {
    PL.vider(libres);
    courants.libres.forEach(function (l, i) {
      libres.appendChild(PL.el("div", { class: "constat-ligne" },
        PL.el("div", { class: "constat-grille" },
          PL.champ({
            label: "Intitulé", valeur: l.libelle, lecture: lecture,
            placeholder: "Autre compteur",
            onChange: function (v) { PL.maj(dossier, function () { l.libelle = v; }); }
          }),
          PL.champ({
            label: "Relevé", valeur: l.valeur, suffixe: l.unite || "", lecture: lecture,
            onChange: function (v) { PL.maj(dossier, function () { l.valeur = v; }); }
          })
        ),
        lecture ? null : PL.el("button", {
          type: "button", class: "btn btn--petit btn--danger",
          onclick: function () {
            PL.maj(dossier, function () { courants.libres.splice(i, 1); });
            peindreLibres();
          }
        }, "Retirer cette ligne")
      ));
    });
    if (!lecture) {
      libres.appendChild(PL.el("button", {
        type: "button", class: "btn btn--petit",
        onclick: function () {
          PL.maj(dossier, function () {
            courants.libres.push({ id: PL.uid(), libelle: "", valeur: "", unite: "" });
          });
          peindreLibres();
        }
      }, "Ajouter un compteur"));
    }
  }
  peindreLibres();
  corps.appendChild(libres);

  return PL.el("div", null,
    PL.enteteDossier(dossier, mode, section),
    corps,
    PL.piedNavigation(dossier, mode, section)
  );
};

/* --- chauffage et divers ---------------------------------------------- */

PL.vues.technique = function (dossier, mode) {
  var lecture = PL.estVerrouille(dossier, mode);
  var section = PL.SECTIONS[2];
  var ch = dossier.edl.chauffage;
  var div = dossier.edl.divers[mode];

  function segChoix(label, valeur, options, onChange) {
    return PL.el("div", { class: "champ" },
      PL.el("span", { class: "champ__label" }, label),
      PL.segmente({
        label: label, valeur: valeur, lecture: lecture,
        options: options.map(function (o) { return { code: o, libelle: o }; }),
        onChange: onChange
      })
    );
  }

  var cles = PL.el("div", null);
  function peindreCles() {
    PL.vider(cles);
    div.cles.forEach(function (k, i) {
      cles.appendChild(PL.el("div", { class: "constat-grille", style: "margin-bottom:6px" },
        PL.champ({
          label: "Nombre de clés", valeur: k.nombre, type: "number", lecture: lecture,
          onChange: function (v) { PL.maj(dossier, function () { k.nombre = v; }); }
        }),
        PL.el("div", { style: "display:flex;gap:8px;align-items:flex-end" },
          PL.champ({
            label: "Pour", valeur: k.usage, lecture: lecture,
            placeholder: "porte palière, boîte aux lettres, cave…",
            onChange: function (v) { PL.maj(dossier, function () { k.usage = v; }); }
          }),
          lecture || div.cles.length < 2 ? null : PL.el("button", {
            type: "button", class: "btn btn--petit btn--danger",
            "aria-label": "Retirer ce jeu de clés",
            style: "margin-bottom:12px",
            onclick: function () {
              PL.maj(dossier, function () { div.cles.splice(i, 1); });
              peindreCles();
            }
          }, "×")
        )
      ));
    });
    if (!lecture) {
      cles.appendChild(PL.el("button", {
        type: "button", class: "btn btn--petit",
        onclick: function () {
          PL.maj(dossier, function () {
            div.cles.push({ id: PL.uid(), nombre: "", usage: "" });
          });
          peindreCles();
        }
      }, "Ajouter un jeu de clés"));
    }
  }
  peindreCles();

  return PL.el("div", null,
    PL.enteteDossier(dossier, mode, section),

    PL.el("section", { class: "carte" },
      PL.el("div", { class: "carte__entete" }, PL.el("h2", null, "Chauffage")),
      PL.el("div", { class: "grille-champs" },
        segChoix("Mode", ch.mode, PL.DEFAULTS.chauffageModes, function (v) {
          PL.maj(dossier, function () { ch.mode = v; });
        }),
        segChoix("Énergie", ch.energie, PL.DEFAULTS.chauffageEnergies, function (v) {
          PL.maj(dossier, function () { ch.energie = v; });
        }),
        PL.champ({
          label: "Nombre de radiateurs", valeur: ch.nbRadiateurs, type: "number",
          lecture: lecture,
          onChange: function (v) { PL.maj(dossier, function () { ch.nbRadiateurs = v; }); }
        }),
        PL.champ({
          label: "Production d'eau chaude", valeur: ch.eauChaude, lecture: lecture,
          placeholder: "chaudière, ballon, cumulus…",
          onChange: function (v) { PL.maj(dossier, function () { ch.eauChaude = v; }); }
        }),
        PL.champ({
          label: "Observations", valeur: ch.note, multiligne: true, large: true,
          lecture: lecture,
          onChange: function (v) { PL.maj(dossier, function () { ch.note = v; }); }
        })
      )
    ),

    PL.el("section", { class: "carte" },
      PL.el("div", { class: "carte__entete" },
        PL.el("h2", null, "Clés remises" + (mode === "sortie" ? " / restituées" : ""))),
      cles
    ),

    PL.el("section", { class: "carte" },
      PL.el("div", { class: "carte__entete" }, PL.el("h2", null, "Sécurité et divers")),
      PL.el("div", { class: "grille-champs" },
        PL.champ({
          label: "Nombre de détecteurs de fumée", valeur: div.detecteurs.nombre,
          type: "number", lecture: lecture,
          onChange: function (v) { PL.maj(dossier, function () { div.detecteurs.nombre = v; }); }
        }),
        PL.el("div", { class: "champ" },
          PL.el("span", { class: "champ__label" }, "Test des détecteurs"),
          PL.caseACocher({
            label: "Test réalisé en présence du locataire",
            coche: div.detecteurs.testRealise, lecture: lecture,
            onChange: function (v) {
              PL.maj(dossier, function () { div.detecteurs.testRealise = v; });
            }
          })
        ),
        PL.champ({
          label: "Réception télévision", valeur: div.receptionTV, lecture: lecture,
          placeholder: "antenne collective, TNT, satellite…",
          onChange: function (v) { PL.maj(dossier, function () { div.receptionTV = v; }); }
        })
      ),
      PL.el("div", { class: "grille-cases", style: "margin:10px 0" },
        [
          { cle: "boiteAuxLettres", libelle: "Boîte aux lettres" },
          { cle: "sonnette", libelle: "Sonnette" },
          { cle: "interphone", libelle: "Interphone" }
        ].map(function (o) {
          return PL.caseACocher({
            label: o.libelle, coche: div[o.cle], lecture: lecture,
            onChange: function (v) { PL.maj(dossier, function () { div[o.cle] = v; }); }
          });
        })
      ),
      PL.champ({
        label: "Autres observations", valeur: div.note, multiligne: true, lecture: lecture,
        onChange: function (v) { PL.maj(dossier, function () { div.note = v; }); }
      })
    ),

    PL.piedNavigation(dossier, mode, section)
  );
};

/* --- pièces ------------------------------------------------------------ */

PL.vues.pieces = function (dossier, mode) {
  var lecture = PL.estVerrouille(dossier, mode);
  var section = PL.SECTIONS[3];
  var champEtat = mode === "sortie" ? "etatSortie" : "etatEntree";
  var champRemarque = mode === "sortie" ? "remarqueSortie" : "remarqueEntree";
  var courante = dossier.edl.pieces.length ? dossier.edl.pieces[0].id : null;

  var nav = PL.el("div", { class: "liste-nav" });
  var panneau = PL.el("div", null);
  var idListe = "revetements-" + PL.uid().slice(0, 6);

  function pieceCourante() {
    return dossier.edl.pieces.filter(function (p) { return p.id === courante; })[0] || null;
  }

  function compteurPiece(p) {
    var faits = PL.SUPPORTS.filter(function (s) { return p.supports[s.cle][champEtat]; }).length;
    return faits + "/" + PL.SUPPORTS.length;
  }

  function peindreNav() {
    PL.vider(nav);
    dossier.edl.pieces.forEach(function (p) {
      var complet = compteurPiece(p) === PL.SUPPORTS.length + "/" + PL.SUPPORTS.length;
      nav.appendChild(PL.el("button", {
        type: "button", class: "liste-nav__item",
        "aria-current": p.id === courante ? "true" : "false",
        onclick: function () { courante = p.id; peindreNav(); peindrePanneau(); }
      },
        PL.el("span", null, p.nom),
        PL.el("span", { class: "hub-item__compte" + (complet ? " hub-item__compte--complet" : "") },
          compteurPiece(p))
      ));
    });
  }

  /* Hors du conteneur défilant : en barre horizontale il deviendrait
     une colonne de plus au lieu d'une action pleine largeur. */
  var zoneAjout = lecture ? null : PL.el("div", { style: "margin-top:8px" },
    PL.el("button", {
      type: "button", class: "btn btn--petit btn--bloc",
      onclick: function () {
        PL.demanderTexte({
          titre: "Ajouter une pièce", label: "Nom de la pièce", valider: "Ajouter"
        }).then(function (nom) {
          if (!nom) return;
          var p = PL.nouvellePiece(nom, true);
          PL.maj(dossier, function (d) { d.edl.pieces.push(p); });
          courante = p.id;
          peindreNav(); peindrePanneau();
        });
      }
    }, "Ajouter une pièce"));

  function peindrePanneau() {
    PL.vider(panneau);
    var p = pieceCourante();
    if (!p) {
      panneau.appendChild(PL.el("div", { class: "etat-vide" }, "Aucune pièce dans ce dossier."));
      return;
    }

    var carte = PL.el("section", { class: "carte" },
      PL.el("div", { class: "carte__entete" },
        PL.el("div", { class: "carte__titre" }, PL.el("h2", null, p.nom)),
        lecture ? null : PL.el("div", { class: "app-entete__actions" },
          PL.el("button", {
            type: "button", class: "btn btn--petit",
            onclick: function () {
              PL.SUPPORTS.forEach(function (s) {
                PL.maj(dossier, function () { p.supports[s.cle][champEtat] = "B"; });
              });
              peindreNav(); peindrePanneau();
              PL.annoncer("Pièce " + p.nom + " renseignée en bon état.");
            }
          }, "Tout en bon état"),
          PL.el("button", {
            type: "button", class: "btn btn--petit",
            onclick: function () {
              PL.demanderTexte({
                titre: "Renommer la pièce", label: "Nom", valeur: p.nom, valider: "Renommer"
              }).then(function (nom) {
                if (!nom) return;
                PL.maj(dossier, function () { p.nom = nom; });
                peindreNav(); peindrePanneau();
              });
            }
          }, "Renommer"),
          PL.el("button", {
            type: "button", class: "btn btn--petit",
            onclick: function () {
              var copie = JSON.parse(JSON.stringify(p));
              copie.id = PL.uid();
              copie.nom = p.nom + " (copie)";
              copie.photos = { entree: [], sortie: [] };
              PL.maj(dossier, function (d) { d.edl.pieces.push(copie); });
              courante = copie.id;
              peindreNav(); peindrePanneau();
            }
          }, "Dupliquer"),
          p.supprimable ? PL.el("button", {
            type: "button", class: "btn btn--petit btn--danger",
            onclick: function () {
              PL.confirmer({
                titre: "Supprimer « " + p.nom + " » ?",
                message: "Le constat de cette pièce et ses photos seront perdus.",
                valider: "Supprimer", danger: true
              }).then(function (ok) {
                if (!ok) return;
                PL.maj(dossier, function (d) {
                  d.edl.pieces = d.edl.pieces.filter(function (x) { return x.id !== p.id; });
                });
                courante = dossier.edl.pieces.length ? dossier.edl.pieces[0].id : null;
                peindreNav(); peindrePanneau();
              });
            }
          }, "Supprimer") : null
        )
      )
    );

    PL.SUPPORTS.forEach(function (s) {
      var sup = p.supports[s.cle];
      carte.appendChild(PL.el("div", { class: "constat-ligne" },
        PL.el("div", { class: "constat-ligne__entete" },
          PL.el("span", { class: "constat-ligne__nom" }, s.libelle),
          mode === "sortie" ? PL.etatLecture(sup.etatEntree) : null
        ),
        PL.el("div", { class: "constat-grille" },
          PL.champ({
            label: "Revêtement", valeur: sup.revetement, lecture: lecture, liste: idListe,
            placeholder: "peinture, carrelage, parquet…",
            onChange: function (v) { PL.maj(dossier, function () { sup.revetement = v; }); }
          }),
          PL.el("div", { class: "champ" },
            PL.el("span", { class: "champ__label" }, "État constaté"),
            PL.segmente({
              label: s.libelle + " — état", valeur: sup[champEtat], options: PL.ETATS_BATI,
              lecture: lecture,
              onChange: function (v) {
                PL.maj(dossier, function () { sup[champEtat] = v; });
                peindreNav();
              }
            })
          ),
          PL.champ({
            label: "Remarques", valeur: sup[champRemarque], multiligne: true, rows: 2,
            large: true, lecture: lecture,
            onChange: function (v) { PL.maj(dossier, function () { sup[champRemarque] = v; }); }
          })
        ),
        mode === "sortie" && sup.remarqueEntree
          ? PL.el("div", { class: "note" }, "Remarque d'entrée : " + sup.remarqueEntree)
          : null
      ));
    });

    if (mode === "sortie" && p.photos.entree.length) {
      var avant = PL.el("div", { style: "margin-top:10px" },
        PL.el("span", { class: "champ__label" }, "Photos d'entrée"));
      var grille = PL.el("div", { class: "photos__grille" });
      p.photos.entree.forEach(function (ref) {
        var v = PL.el("div", { class: "photo-vignette" });
        PL.photos.get(ref.id).then(function (data) {
          if (data) v.appendChild(PL.el("img", { src: data, alt: "Photo d'entrée" }));
        });
        grille.appendChild(v);
      });
      avant.appendChild(grille);
      carte.appendChild(avant);
    }

    carte.appendChild(PL.el("div", { style: "margin-top:12px" },
      PL.el("span", { class: "champ__label" },
        "Photos — " + PL.libelleMode(mode).toLowerCase()),
      PL.blocPhotos({
        liste: p.photos[mode], lecture: lecture,
        onChange: function () { PL.maj(dossier, function () {}); }
      })
    ));

    panneau.appendChild(carte);
  }

  peindreNav();
  peindrePanneau();

  return PL.el("div", null,
    PL.enteteDossier(dossier, mode, section),
    PL.datalist(idListe, PL.REVETEMENTS),
    PL.el("div", { class: "duo" },
      PL.el("aside", { class: "duo__aside" },
        PL.el("div", { class: "carte" },
          PL.el("h2", { style: "margin-bottom:8px;font-size:0.95rem" }, "Pièces"),
          nav, zoneAjout)
      ),
      panneau
    ),
    PL.piedNavigation(dossier, mode, section)
  );
};

/* --- équipements -------------------------------------------------------- */

PL.vues.equipements = function (dossier, mode) {
  var lecture = PL.estVerrouille(dossier, mode);
  var section = PL.SECTIONS[4];
  var champ = mode === "sortie" ? "presentSortie" : "presentEntree";

  var blocs = [
    { cle: "cuisine", titre: "Équipements cuisine" },
    { cle: "salleDEau", titre: "Équipements salle d'eau" },
    { cle: "wc", titre: "Équipements WC" }
  ];

  var racine = PL.el("div", null,
    PL.enteteDossier(dossier, mode, section),
    PL.el("div", { class: "note" },
      "Cochez les équipements présents et en place au moment du constat. " +
      "Utilisez le champ « précision » pour un modèle, une marque ou une réserve.")
  );

  blocs.forEach(function (b) {
    var carte = PL.el("section", { class: "carte" },
      PL.el("div", { class: "carte__entete" }, PL.el("h2", null, b.titre)));
    var liste = PL.el("div", null);

    function peindre() {
      PL.vider(liste);
      dossier.edl.equipements[b.cle].forEach(function (eq, i) {
        liste.appendChild(PL.el("div", { class: "constat-grille", style: "margin-bottom:6px" },
          PL.caseACocher({
            label: eq.libelle, coche: eq[champ], lecture: lecture,
            onChange: function (v) { PL.maj(dossier, function () { eq[champ] = v; }); }
          }),
          PL.el("div", { style: "display:flex;gap:6px;align-items:flex-end" },
            PL.champ({
              label: "Précision", valeur: eq.precision, lecture: lecture,
              onChange: function (v) { PL.maj(dossier, function () { eq.precision = v; }); }
            }),
            lecture ? null : PL.el("button", {
              type: "button", class: "btn btn--petit btn--danger",
              "aria-label": "Retirer " + eq.libelle, style: "margin-bottom:12px",
              onclick: function () {
                PL.maj(dossier, function () {
                  dossier.edl.equipements[b.cle].splice(i, 1);
                });
                peindre();
              }
            }, "×")
          )
        ));
      });
      if (!lecture) {
        liste.appendChild(PL.el("button", {
          type: "button", class: "btn btn--petit",
          onclick: function () {
            PL.demanderTexte({
              titre: "Ajouter un équipement", label: "Désignation", valider: "Ajouter"
            }).then(function (nom) {
              if (!nom) return;
              PL.maj(dossier, function () {
                dossier.edl.equipements[b.cle].push({
                  id: PL.uid(), libelle: nom, presentEntree: mode === "entree",
                  presentSortie: false, precision: ""
                });
              });
              peindre();
            });
          }
        }, "Ajouter un équipement"));
      }
    }

    peindre();
    carte.appendChild(liste);
    racine.appendChild(carte);
  });

  racine.appendChild(PL.piedNavigation(dossier, mode, section));
  return racine;
};


/* === 63-view-mobilier.js === */
/* ------------------------------------------------------------------
   Inventaire et état des meubles — annexe obligatoire du bail meublé
   (art. 25-8 de la loi n° 89-462).
   ------------------------------------------------------------------ */

PL.vues.mobilier = function (dossier, mode) {
  var lecture = PL.estVerrouille(dossier, mode);
  var section = PL.SECTIONS[5];
  var champEtat = mode === "sortie" ? "etatSortie" : "etatEntree";
  var courante = dossier.mobilier.sections.length ? dossier.mobilier.sections[0].id : null;

  var nav = PL.el("div", { class: "liste-nav" });
  var panneau = PL.el("div", null);

  function sectionCourante() {
    return dossier.mobilier.sections.filter(function (s) { return s.id === courante; })[0] || null;
  }

  function compteur(sec) {
    var faits = sec.lignes.filter(function (l) { return l.absent || l[champEtat]; }).length;
    return faits + "/" + sec.lignes.length;
  }

  function peindreNav() {
    PL.vider(nav);
    dossier.mobilier.sections.forEach(function (sec) {
      var complet = sec.lignes.length > 0 &&
        sec.lignes.every(function (l) { return l.absent || l[champEtat]; });
      nav.appendChild(PL.el("button", {
        type: "button", class: "liste-nav__item",
        "aria-current": sec.id === courante ? "true" : "false",
        onclick: function () { courante = sec.id; peindreNav(); peindrePanneau(); }
      },
        PL.el("span", null, sec.titre),
        PL.el("span", { class: "hub-item__compte" + (complet ? " hub-item__compte--complet" : "") },
          compteur(sec))
      ));
    });
  }

  /* Hors du conteneur défilant : en barre horizontale il deviendrait
     une colonne de plus au lieu d'une action pleine largeur. */
  var zoneAjout = lecture ? null : PL.el("div", { style: "margin-top:8px" },
    PL.el("button", {
      type: "button", class: "btn btn--petit btn--bloc",
      onclick: function () {
        PL.demanderTexte({
          titre: "Ajouter une section", label: "Intitulé de la section", valider: "Ajouter"
        }).then(function (titre) {
          if (!titre) return;
          var sec = PL.nouvelleSection(titre, []);
          PL.maj(dossier, function (d) { d.mobilier.sections.push(sec); });
          courante = sec.id;
          peindreNav(); peindrePanneau();
        });
      }
    }, "Ajouter une section"));

  function peindrePanneau() {
    PL.vider(panneau);
    var sec = sectionCourante();
    if (!sec) {
      panneau.appendChild(PL.el("div", { class: "etat-vide" }, "Aucune section d'inventaire."));
      return;
    }

    var carte = PL.el("section", { class: "carte" },
      PL.el("div", { class: "carte__entete" },
        PL.el("div", { class: "carte__titre" }, PL.el("h2", null, sec.titre)),
        lecture ? null : PL.el("div", { class: "app-entete__actions" },
          PL.el("button", {
            type: "button", class: "btn btn--petit",
            onclick: function () {
              PL.maj(dossier, function () {
                sec.lignes.forEach(function (l) { if (!l.absent) l[champEtat] = "B"; });
              });
              peindreNav(); peindrePanneau();
              PL.annoncer("Section " + sec.titre + " renseignée en bon état.");
            }
          }, "Tout en bon état"),
          PL.el("button", {
            type: "button", class: "btn btn--petit",
            onclick: function () {
              PL.demanderTexte({
                titre: "Renommer la section", label: "Intitulé", valeur: sec.titre,
                valider: "Renommer"
              }).then(function (t) {
                if (!t) return;
                PL.maj(dossier, function () { sec.titre = t; });
                peindreNav(); peindrePanneau();
              });
            }
          }, "Renommer"),
          PL.el("button", {
            type: "button", class: "btn btn--petit btn--danger",
            onclick: function () {
              PL.confirmer({
                titre: "Supprimer « " + sec.titre + " » ?",
                message: "Les " + sec.lignes.length + " lignes de cette section seront perdues.",
                valider: "Supprimer", danger: true
              }).then(function (ok) {
                if (!ok) return;
                PL.maj(dossier, function (d) {
                  d.mobilier.sections = d.mobilier.sections.filter(function (x) {
                    return x.id !== sec.id;
                  });
                });
                courante = dossier.mobilier.sections.length
                  ? dossier.mobilier.sections[0].id : null;
                peindreNav(); peindrePanneau();
              });
            }
          }, "Supprimer la section")
        )
      ),
      PL.el("div", { class: "note" },
        "Quantité : indiquez « Ø » ou cochez « absent » si l'élément n'est pas présent. " +
        "États : TB très bon, B bon, P passable, M mauvais.")
    );

    var lignes = PL.el("div", null);

    function peindreLignes() {
      PL.vider(lignes);
      sec.lignes.forEach(function (l) {
        var segment = PL.segmente({
          label: l.libelle + " — état", valeur: l[champEtat], options: PL.ETATS_MOBILIER,
          lecture: lecture || l.absent,
          onChange: function (v) {
            PL.maj(dossier, function () { l[champEtat] = v; });
            peindreNav();
          }
        });
        if (l.absent) segment.classList.add("segmente--desactive");

        lignes.appendChild(PL.el("div", {
          class: "inv-ligne" + (l.absent ? " inv-ligne--absente" : "")
        },
          PL.el("div", { class: "inv-ligne__tete" },
            PL.el("span", { class: "inv-ligne__nom" }, l.libelle),
            PL.el("span", { style: "display:flex;gap:8px;align-items:center" },
              mode === "sortie" ? PL.etatLecture(l.etatEntree) : null,
              lecture ? null : PL.el("button", {
                type: "button", class: "btn btn--petit",
                "aria-label": "Renommer " + l.libelle,
                onclick: function () {
                  PL.demanderTexte({
                    titre: "Renommer la ligne", label: "Désignation", valeur: l.libelle,
                    valider: "Renommer"
                  }).then(function (t) {
                    if (!t) return;
                    PL.maj(dossier, function () { l.libelle = t; });
                    peindreLignes();
                  });
                }
              }, "Renommer"),
              lecture ? null : PL.el("button", {
                type: "button", class: "btn btn--petit btn--danger",
                "aria-label": "Supprimer " + l.libelle,
                onclick: function () {
                  PL.maj(dossier, function () {
                    sec.lignes = sec.lignes.filter(function (x) { return x.id !== l.id; });
                  });
                  peindreNav(); peindreLignes();
                }
              }, "×")
            )
          ),
          PL.el("div", { class: "constat-grille" },
            PL.el("div", { style: "display:flex;gap:10px;align-items:flex-end" },
              PL.el("div", { class: "inv-ligne__qte" },
                PL.champ({
                  label: "Quantité", valeur: l.qte, lecture: lecture || l.absent,
                  onChange: function (v) { PL.maj(dossier, function () { l.qte = v; }); }
                })
              ),
              PL.el("div", { style: "flex:1;margin-bottom:12px" },
                PL.caseACocher({
                  label: "Absent (Ø)", coche: l.absent, lecture: lecture,
                  onChange: function (v) {
                    PL.maj(dossier, function () {
                      l.absent = v;
                      if (v) { l.qte = "Ø"; l.etatEntree = null; l.etatSortie = null; }
                      else if (l.qte === "Ø") l.qte = "";
                    });
                    peindreNav(); peindreLignes();
                  }
                })
              )
            ),
            PL.el("div", { class: "champ" },
              PL.el("span", { class: "champ__label" },
                "État " + PL.libelleMode(mode).toLowerCase()),
              segment
            ),
            PL.champ({
              label: "Observations", valeur: l.observations, multiligne: true, rows: 2,
              large: true, lecture: lecture,
              onChange: function (v) { PL.maj(dossier, function () { l.observations = v; }); }
            })
          ),
          PL.blocPhotos({
            liste: l.photos[mode], lecture: lecture,
            onChange: function () { PL.maj(dossier, function () {}); }
          })
        ));
      });

      if (!lecture) {
        lignes.appendChild(PL.el("button", {
          type: "button", class: "btn btn--petit", style: "margin-top:10px",
          onclick: function () {
            PL.demanderTexte({
              titre: "Ajouter une ligne", label: "Désignation", valider: "Ajouter"
            }).then(function (t) {
              if (!t) return;
              PL.maj(dossier, function () { sec.lignes.push(PL.nouvelleLigne(t)); });
              peindreNav(); peindreLignes();
            });
          }
        }, "Ajouter une ligne"));
      }
    }

    peindreLignes();
    carte.appendChild(lignes);
    panneau.appendChild(carte);
  }

  peindreNav();
  peindrePanneau();

  return PL.el("div", null,
    PL.enteteDossier(dossier, mode, section),
    PL.el("div", { class: "duo" },
      PL.el("aside", { class: "duo__aside" },
        PL.el("div", { class: "carte" },
          PL.el("h2", { style: "margin-bottom:8px;font-size:0.95rem" }, "Sections"),
          nav, zoneAjout)
      ),
      panneau
    ),
    PL.piedNavigation(dossier, mode, section)
  );
};


/* === 64-view-signature.js === */

   Observations, contrôle de complétion, signatures tactiles et
   verrouillage de la campagne.
   ------------------------------------------------------------------ */

PL.manques = function (dossier, mode) {
  var liste = [];
  var camp = dossier.campagnes[mode];
  var champEtat = mode === "sortie" ? "etatSortie" : "etatEntree";

  if (!dossier.logement.adresse.trim()) liste.push("Adresse du logement");
  if (!dossier.bailleur.nom.trim()) liste.push("Nom du bailleur");
  if (!dossier.locataire.nom.trim()) liste.push("Nom du locataire");
  if (!camp.date) liste.push("Date du constat");
  if (!camp.lieu.trim()) liste.push("Lieu (« fait à »)");

  var cptVides = PL.DEFAULTS.compteurs.filter(function (m) {
    return !String(dossier.edl.compteurs[mode][m.cle].valeur).trim();
  });
  if (cptVides.length) {
    liste.push("Compteurs non relevés : " + cptVides.map(function (m) {
      return m.libelle;
    }).join(", "));
  }

  dossier.edl.pieces.forEach(function (p) {
    var vides = PL.SUPPORTS.filter(function (s) { return !p.supports[s.cle][champEtat]; });
    if (vides.length) {
      liste.push(p.nom + " : " + vides.map(function (s) {
        return s.libelle.toLowerCase();
      }).join(", ") + " sans état");
    }
  });

  dossier.mobilier.sections.forEach(function (sec) {
    var n = sec.lignes.filter(function (l) { return !l.absent && !l[champEtat]; }).length;
    if (n) liste.push(sec.titre + " : " + n + " ligne" + (n > 1 ? "s" : "") + " sans état");
  });

  return liste;
};

PL.zoneSignature = function (o) {
  /* o : { valeur, onChange, lecture, titre } */
  var canvas = PL.el("canvas", { class: "signature-zone", "aria-label": "Zone de signature — " + o.titre });
  var ctx = null;
  var dessine = false;
  var vierge = true;

  function dimensionner() {
    var dpr = window.devicePixelRatio || 1;
    var largeur = canvas.clientWidth || 420;
    var hauteur = 170;
    canvas.width = Math.round(largeur * dpr);
    canvas.height = Math.round(hauteur * dpr);
    ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, largeur, hauteur);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#111111";
    if (o.valeur) {
      var img = new Image();
      img.onload = function () { ctx.drawImage(img, 0, 0, largeur, hauteur); };
      img.src = o.valeur;
      vierge = false;
    }
  }

  function position(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  if (!o.lecture) {
    canvas.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      dessine = true;
      vierge = false;
      var p = position(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    });
    canvas.addEventListener("pointermove", function (e) {
      if (!dessine) return;
      var p = position(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (evt) {
      canvas.addEventListener(evt, function () {
        if (!dessine) return;
        dessine = false;
        o.onChange(canvas.toDataURL("image/png"));
      });
    });
  }

  setTimeout(dimensionner, 0);

  var bloc = PL.el("div", null,
    PL.el("span", { class: "champ__label" }, o.titre),
    canvas,
    PL.el("div", { class: "signature-legende" },
      PL.el("span", null, "« Lu et approuvé »"),
      o.lecture ? null : PL.el("button", {
        type: "button", class: "btn btn--petit",
        onclick: function () {
          dimensionner();
          var l = canvas.clientWidth || 420;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, l, 170);
          ctx.strokeStyle = "#111111";
          vierge = true;
          o.onChange("");
        }
      }, "Effacer")
    )
  );
  bloc.estVierge = function () { return vierge; };
  return bloc;
};

PL.vues.signatures = function (dossier, mode) {
  var section = PL.SECTIONS[6];
  var camp = dossier.campagnes[mode];
  var verrou = PL.estVerrouille(dossier, mode);
  var racine = PL.el("div", null, PL.enteteDossier(dossier, mode, section));

  racine.appendChild(PL.el("section", { class: "carte" },
    PL.el("div", { class: "carte__entete" },
      PL.el("h2", null, "Observations et réserves")),
    PL.champ({
      label: "Observations du constat " + PL.deMode(mode),
      valeur: dossier.observations[mode], multiligne: true, rows: 5, lecture: verrou,
      onChange: function (v) { PL.maj(dossier, function (d) { d.observations[mode] = v; }); }
    })
  ));

  /* --- contrôle de complétion : informe, ne bloque pas --- */
  var manques = PL.manques(dossier, mode);
  var carteControle = PL.el("section", { class: "carte" },
    PL.el("div", { class: "carte__entete" },
      PL.el("h2", null, "Contrôle avant signature"),
      PL.el("span", { class: "dossier-ligne__meta" },
        PL.progression(dossier, mode).global.pourcent + " % renseigné")
    )
  );
  if (manques.length) {
    carteControle.appendChild(PL.el("div", { class: "note" },
      manques.length + " point" + (manques.length > 1 ? "s" : "") +
      " non renseigné" + (manques.length > 1 ? "s" : "") +
      ". Vous pouvez signer malgré tout : un élément laissé vide sera imprimé vide."));
    var ul = PL.el("ul", { class: "liste-manques" });
    manques.slice(0, 20).forEach(function (m) { ul.appendChild(PL.el("li", null, m)); });
    if (manques.length > 20) {
      ul.appendChild(PL.el("li", null, "… et " + (manques.length - 20) + " autres."));
    }
    carteControle.appendChild(ul);
  } else {
    carteControle.appendChild(PL.el("p", null, "Tous les postes du constat sont renseignés."));
  }
  racine.appendChild(carteControle);

  /* --- délais légaux --- */
  racine.appendChild(PL.el("section", { class: "carte carte--sourde" },
    PL.el("h2", { style: "margin-bottom:8px" }, "Délais de réserve à rappeler au locataire"),
    PL.el("p", null,
      "Le locataire peut demander la modification de l'état des lieux d'entrée dans les " +
      "dix jours suivant son établissement."),
    PL.el("p", { style: "margin-bottom:0" },
      "Pour les éléments de chauffage, cette demande reste possible pendant le premier mois " +
      "de la période de chauffe.")
  ));

  /* --- signatures --- */
  var carteSign = PL.el("section", { class: "carte" },
    PL.el("div", { class: "carte__entete" },
      PL.el("h2", null, "Signatures"),
      camp.signeLe
        ? PL.el("span", { class: "badge badge--signe" }, "Signé le " + PL.formaterDate(camp.signeLe))
        : null
    ),
    PL.el("div", { class: "grille-champs" },
      PL.champ({
        label: "Nom du bailleur (ou de son mandataire)", valeur: camp.nomBailleur,
        lecture: verrou,
        onChange: function (v) { PL.maj(dossier, function () { camp.nomBailleur = v; }); }
      }),
      PL.champ({
        label: "Nom du locataire", valeur: camp.nomLocataire, lecture: verrou,
        onChange: function (v) { PL.maj(dossier, function () { camp.nomLocataire = v; }); }
      })
    ),
    PL.el("div", { class: "signature-bloc" },
      PL.zoneSignature({
        titre: "Signature du bailleur", valeur: camp.signatureBailleur, lecture: verrou,
        onChange: function (v) { PL.maj(dossier, function () { camp.signatureBailleur = v; }); }
      }),
      PL.zoneSignature({
        titre: "Signature du locataire", valeur: camp.signatureLocataire, lecture: verrou,
        onChange: function (v) { PL.maj(dossier, function () { camp.signatureLocataire = v; }); }
      })
    ),
    PL.el("div", { class: "note" },
      "La signature tactile recueillie ici vaut commencement de preuve écrite. " +
      "Elle ne constitue pas une signature électronique qualifiée au sens du règlement eIDAS. " +
      "Pour un constat contradictoire, imprimez et faites signer les exemplaires papier.")
  );

  var actions = PL.el("div", { class: "barre-actions" });
  if (verrou) {
    actions.appendChild(PL.el("button", {
      type: "button", class: "btn",
      onclick: function () {
        PL.confirmer({
          titre: "Rouvrir le constat ?",
          message: "Le constat redeviendra modifiable. La date de signature sera effacée " +
            "et devra être reprise après correction.",
          valider: "Rouvrir"
        }).then(function (ok) {
          if (!ok) return;
          PL.maj(dossier, function () { camp.verrouille = false; camp.signeLe = null; });
          PL.toast("Constat rouvert.");
          PL.router.rafraichir();
        });
      }
    }, "Rouvrir le constat"));
  } else {
    actions.appendChild(PL.el("button", {
      type: "button", class: "btn btn--principal",
      onclick: function () {
        var message = manques.length
          ? manques.length + " point(s) restent non renseignés. Le constat sera verrouillé " +
            "en l'état et passera en lecture seule."
          : "Le constat sera verrouillé et passera en lecture seule. " +
            "Vous pourrez le rouvrir explicitement si nécessaire.";
        PL.confirmer({
          titre: "Signer et verrouiller le constat " + PL.deMode(mode) + " ?",
          message: message, valider: "Signer et verrouiller"
        }).then(function (ok) {
          if (!ok) return;
          PL.maj(dossier, function () {
            camp.verrouille = true;
            camp.signeLe = new Date().toISOString();
          });
          PL.toast("Constat signé et verrouillé.");
          PL.router.rafraichir();
        });
      }
    }, "Signer et verrouiller"));
  }
  actions.appendChild(PL.el("button", {
    type: "button", class: "btn",
    onclick: function () { PL.router.go("/d/" + dossier.id + "/" + mode); }
  }, "Retour au sommaire"));

  carteSign.appendChild(actions);
  racine.appendChild(carteSign);
  return racine;
};


/* === 70-print.js === */
/* ------------------------------------------------------------------
   Rendu d'impression. Le DOM A4 est reconstruit à partir du store :
   il ne réutilise jamais le DOM de saisie. C'est ce qui permet de
   maîtriser la pagination sans contraindre l'ergonomie tactile.
   ------------------------------------------------------------------ */

(function () {
  var attentesImages = [];

  function el(tag, props) {
    return PL.el.apply(null, arguments);
  }

  function texteOu(v, defaut) {
    var s = v === null || v === undefined ? "" : String(v).trim();
    return s || (defaut === undefined ? "" : defaut);
  }

  /* Image chargée depuis IndexedDB : on mémorise la promesse pour
     n'imprimer qu'une fois toutes les images décodées. */
  function image(refId, alt, classe) {
    var img = el("img", { class: classe || "p-photo", alt: alt || "" });
    attentesImages.push(
      PL.photos.get(refId).then(function (data) {
        if (!data) return null;
        img.src = data;
        return img.decode ? img.decode().catch(function () {}) : null;
      }).catch(function () { return null; })
    );
    return img;
  }

  function grillePhotos(refs, legende) {
    if (!refs || !refs.length) return null;
    return el("div", { class: "p-photos p-eviter-coupure" },
      el("div", { class: "p-photos__titre" }, legende),
      el("div", { class: "p-photos__grille" },
        refs.map(function (r) { return image(r.id, legende); }))
    );
  }

  /* Le titre passe dans le <thead> : ainsi il est réémis en haut de chaque
     page quand le tableau se scinde. Un simple <h2> au-dessus laisserait la
     page suivante commencer par des lignes orphelines de leur section. */
  function tableau(entetes, lignes, titre) {
    var thead = el("thead", null);
    if (titre) {
      thead.appendChild(el("tr", null,
        el("th", { colspan: entetes.length, class: "p-table__titre", scope: "colgroup" }, titre)));
    }
    thead.appendChild(el("tr", null, entetes.map(function (h) {
      return el("th", h.style ? { style: h.style, scope: "col" } : { scope: "col" },
        h.libelle || h);
    })));
    return el("table", { class: "p-table" }, thead, el("tbody", null, lignes));
  }

  function blocIdentite(dossier, mode) {
    var camp = dossier.campagnes[mode];
    var l = dossier.logement;
    var complement = [
      l.batiment && "Bât. " + l.batiment,
      l.escalier && "Esc. " + l.escalier,
      l.etage && "Étage " + l.etage,
      l.porte && "Porte " + l.porte
    ].filter(Boolean).join(" · ");

    return el("section", { class: "p-identite p-eviter-coupure" },
      el("div", { class: "p-identite__col" },
        el("h3", null, "Logement"),
        el("p", null, texteOu(l.adresse, "—")),
        complement ? el("p", null, complement) : null
      ),
      el("div", { class: "p-identite__col" },
        el("h3", null, "Bailleur"),
        el("p", null, texteOu(dossier.bailleur.nom, "—")),
        el("p", null, texteOu(dossier.bailleur.adresse, ""))
      ),
      el("div", { class: "p-identite__col" },
        el("h3", null, "Locataire"),
        el("p", null, texteOu(dossier.locataire.nom, "—")),
        el("p", null, texteOu(
          mode === "sortie" ? dossier.locataire.adresseSortie : dossier.locataire.adresseEntree, "")),
        el("p", null, "Date du constat : " + texteOu(PL.dateFr(camp.date), "—"))
      )
    );
  }

  function blocSignatures(dossier, mode) {
    var camp = dossier.campagnes[mode];
    function case_(titre, nom, signature) {
      return el("div", { class: "p-signature" },
        el("div", { class: "p-signature__titre" }, titre),
        el("div", { class: "p-signature__mention" }, "« Lu et approuvé »"),
        el("div", { class: "p-signature__zone" },
          signature ? el("img", { src: signature, alt: "Signature" }) : null),
        el("div", { class: "p-signature__nom" }, texteOu(nom, ""))
      );
    }
    return el("section", { class: "p-eviter-coupure", style: "margin-top:6mm" },
      el("p", { class: "p-mention" },
        "Fait à " + texteOu(camp.lieu, "……………………") +
        ", le " + texteOu(PL.dateFr(camp.date), "……/……/…………") +
        ", en " + texteOu(camp.nbExemplaires, "……") + " exemplaires originaux."),
      el("div", { class: "p-signatures" },
        case_("Le bailleur", camp.nomBailleur, camp.signatureBailleur),
        case_("Le locataire", camp.nomLocataire, camp.signatureLocataire))
    );
  }

  function enteteDocument(dossier, mode, titre, sousTitre) {
    var incomplet = !dossier.campagnes[mode].signeLe;
    return el("header", { class: "p-entete" },
      el("h1", null, titre),
      el("p", { class: "p-entete__sous" }, sousTitre),
      incomplet ? el("p", { class: "p-entete__mention" },
        "Document non signé — projet de constat") : null
    );
  }

  /* --- état des lieux ------------------------------------------------- */

  function celluleSupport(sup, mode) {
    var contenu = [];
    if (sup.revetement) contenu.push(el("div", { class: "p-revetement" }, sup.revetement));
    if (mode === "sortie") {
      contenu.push(el("div", { class: "p-etat" },
        "E : " + texteOu(sup.etatEntree, "—") + "  →  S : " + texteOu(sup.etatSortie, "—")));
    } else {
      contenu.push(el("div", { class: "p-etat" }, texteOu(sup.etatEntree, "—")));
    }
    return el("td", null, contenu);
  }

  PL.print = PL.print || {};

  PL.print.edl = function (dossier, mode) {
    var frag = document.createDocumentFragment();
    var camp = dossier.campagnes[mode];

    frag.appendChild(enteteDocument(dossier, mode,
      "État des lieux",
      "Constat " + PL.deMode(mode) +
      (camp.date ? " — " + PL.dateFr(camp.date) : "")));
    frag.appendChild(blocIdentite(dossier, mode));

    /* compteurs */
    var cpt = dossier.edl.compteurs[mode];
    var lignesCpt = PL.DEFAULTS.compteurs.map(function (m) {
      return el("tr", { class: "p-eviter-coupure" },
        el("td", null, m.libelle),
        el("td", { class: "p-num" }, texteOu(cpt[m.cle].valeur, "…………")),
        el("td", null, m.unite));
    });
    (cpt.libres || []).forEach(function (l) {
      if (!l.libelle && !l.valeur) return;
      lignesCpt.push(el("tr", { class: "p-eviter-coupure" },
        el("td", null, texteOu(l.libelle, "—")),
        el("td", { class: "p-num" }, texteOu(l.valeur, "…………")),
        el("td", null, texteOu(l.unite, ""))));
    });

    /* Les clichés de compteur restent avec leur relevé : c'est le chiffre
       qu'ils justifient, et c'est celui qui est le plus souvent contesté. */
    var photosCompteurs = [];
    PL.DEFAULTS.compteurs.forEach(function (m) {
      var refs = (cpt[m.cle] && cpt[m.cle].photos) || [];
      if (refs.length) photosCompteurs.push(grillePhotos(refs, m.libelle));
    });

    frag.appendChild(el("section", { class: "p-section" },
      el("h2", null, "Relevé des compteurs"),
      tableau([
        { libelle: "Compteur", style: "width:55%" },
        { libelle: "Relevé", style: "width:30%" },
        { libelle: "Unité", style: "width:15%" }
      ], lignesCpt),
      photosCompteurs.length
        ? el("div", { style: "margin-top:3mm" }, photosCompteurs)
        : null
    ));

    /* chauffage et divers */
    var ch = dossier.edl.chauffage;
    var div = dossier.edl.divers[mode];
    var cles = (div.cles || []).filter(function (k) { return k.nombre || k.usage; })
      .map(function (k) {
        return texteOu(k.nombre, "…") + " clé(s) pour " + texteOu(k.usage, "……………………");
      });
    var presents = [
      div.boiteAuxLettres && "Boîte aux lettres",
      div.sonnette && "Sonnette",
      div.interphone && "Interphone"
    ].filter(Boolean);

    frag.appendChild(el("section", { class: "p-section p-eviter-coupure" },
      el("h2", null, "Chauffage, clés et sécurité"),
      el("div", { class: "p-deux-col" },
        el("div", null,
          el("p", null, el("strong", null, "Chauffage : "),
            texteOu(ch.mode, "—") + (ch.energie ? " · " + ch.energie : "") +
            (ch.nbRadiateurs ? " · " + ch.nbRadiateurs + " radiateur(s)" : "")),
          ch.eauChaude ? el("p", null, el("strong", null, "Eau chaude : "), ch.eauChaude) : null,
          ch.note ? el("p", null, ch.note) : null
        ),
        el("div", null,
          cles.length ? el("p", null, el("strong", null, "Clés : "), cles.join(" ; ")) : null,
          el("p", null, el("strong", null, "Détecteurs de fumée : "),
            texteOu(div.detecteurs.nombre, "…") +
            (div.detecteurs.testRealise ? " — test réalisé" : " — test non réalisé")),
          div.receptionTV ? el("p", null, el("strong", null, "Réception TV : "), div.receptionTV) : null,
          presents.length ? el("p", null, el("strong", null, "Présents : "), presents.join(" · ")) : null,
          div.note ? el("p", null, div.note) : null
        )
      )
    ));

    /* pièces */
    var lignesPieces = [];
    dossier.edl.pieces.forEach(function (p) {
      var remarques = PL.SUPPORTS.map(function (s) {
        var sup = p.supports[s.cle];
        var r = mode === "sortie" ? sup.remarqueSortie : sup.remarqueEntree;
        return r ? s.libelle + " : " + r : null;
      }).filter(Boolean).join(" · ");
      lignesPieces.push(el("tr", { class: "p-eviter-coupure" },
        el("th", { scope: "row" }, p.nom),
        celluleSupport(p.supports.plafond, mode),
        celluleSupport(p.supports.murs, mode),
        celluleSupport(p.supports.sol, mode),
        el("td", null, remarques)
      ));
    });

    frag.appendChild(el("section", { class: "p-section" },
      el("p", { class: "p-legende" },
        "Revêtement indiqué au-dessus de l'état. États : N = neuf, B = bon, M = mauvais." +
        (mode === "sortie" ? " E = entrée, S = sortie." : "")),
      tableau([
        { libelle: "Pièce", style: "width:16%" },
        { libelle: "Plafond", style: "width:17%" },
        { libelle: "Murs", style: "width:17%" },
        { libelle: "Sol", style: "width:17%" },
        { libelle: "Remarques", style: "width:33%" }
      ], lignesPieces, "État des pièces")
    ));

    /* équipements */
    var blocsEquip = [
      { cle: "cuisine", titre: "Cuisine" },
      { cle: "salleDEau", titre: "Salle d'eau" },
      { cle: "wc", titre: "WC" }
    ];
    var champPresent = mode === "sortie" ? "presentSortie" : "presentEntree";
    var contenuEquip = blocsEquip.map(function (b) {
      var items = dossier.edl.equipements[b.cle].map(function (eq) {
        return el("li", { class: eq[champPresent] ? "p-coche" : "p-non-coche" },
          eq.libelle + (eq.precision ? " — " + eq.precision : ""));
      });
      return el("div", null, el("h3", null, b.titre), el("ul", { class: "p-liste-cases" }, items));
    });

    frag.appendChild(el("section", { class: "p-section p-eviter-coupure" },
      el("h2", null, "Équipements"),
      el("p", { class: "p-legende" }, "☑ présent et en place · ☐ absent ou non constaté"),
      el("div", { class: "p-trois-col" }, contenuEquip)
    ));

    /* photos des pièces */
    var photos = [];
    dossier.edl.pieces.forEach(function (p) {
      var refs = p.photos[mode] || [];
      if (refs.length) photos.push(grillePhotos(refs, p.nom));
    });
    if (photos.length) {
      frag.appendChild(el("section", { class: "p-section" },
        el("h2", null, "Photographies"), photos));
    }

    /* observations */
    frag.appendChild(el("section", { class: "p-section p-eviter-coupure" },
      el("h2", null, "Observations et réserves"),
      el("div", { class: "p-zone-texte" }, texteOu(dossier.observations[mode], ""))
    ));

    frag.appendChild(blocSignatures(dossier, mode));
    return frag;
  };

  /* --- inventaire mobilier --------------------------------------------- */

  PL.print.mobilier = function (dossier, mode) {
    var frag = document.createDocumentFragment();
    var camp = dossier.campagnes[mode];

    frag.appendChild(enteteDocument(dossier, mode,
      "Inventaire et état des meubles",
      "Annexe obligatoire au bail meublé — article 25-8 de la loi n° 89-462" +
      (camp.date ? " · " + PL.dateFr(camp.date) : "")));
    frag.appendChild(blocIdentite(dossier, mode));

    frag.appendChild(el("p", { class: "p-legende" },
      "États : TB = très bon, B = bon, P = passable, M = mauvais. " +
      "« Ø » en quantité signale un élément absent."));

    dossier.mobilier.sections.forEach(function (sec) {
      var lignes = sec.lignes.map(function (l) {
        return el("tr", { class: "p-eviter-coupure" },
          el("th", { scope: "row" }, l.libelle),
          el("td", { class: "p-num" }, l.absent ? "Ø" : texteOu(l.qte, "")),
          el("td", { class: "p-num" }, l.absent ? "—" : texteOu(l.etatEntree, "")),
          el("td", { class: "p-num" }, l.absent ? "—" : texteOu(l.etatSortie, "")),
          el("td", null, texteOu(l.observations, ""))
        );
      });
      frag.appendChild(el("section", { class: "p-section" },
        tableau([
          { libelle: "Désignation", style: "width:38%" },
          { libelle: "Qté", style: "width:9%" },
          { libelle: "État entrée", style: "width:12%" },
          { libelle: "État sortie", style: "width:12%" },
          { libelle: "Observations", style: "width:29%" }
        ], lignes, sec.titre)
      ));
    });

    var photos = [];
    dossier.mobilier.sections.forEach(function (sec) {
      sec.lignes.forEach(function (l) {
        var refs = l.photos[mode] || [];
        if (refs.length) photos.push(grillePhotos(refs, sec.titre + " — " + l.libelle));
      });
    });
    if (photos.length) {
      frag.appendChild(el("section", { class: "p-section" },
        el("h2", null, "Photographies"), photos));
    }

    frag.appendChild(el("section", { class: "p-section p-eviter-coupure" },
      el("h2", null, "Observations et réserves"),
      el("div", { class: "p-zone-texte" }, texteOu(dossier.observations[mode], ""))
    ));

    frag.appendChild(blocSignatures(dossier, mode));
    return frag;
  };

  /* --- écarts entrée / sortie ------------------------------------------ */

  PL.print.calculerEcarts = function (dossier) {
    var ecarts = [];

    dossier.edl.pieces.forEach(function (p) {
      PL.SUPPORTS.forEach(function (s) {
        var sup = p.supports[s.cle];
        if (!sup.etatEntree || !sup.etatSortie) return;
        if (PL.RANG_BATI[sup.etatSortie] > PL.RANG_BATI[sup.etatEntree]) {
          ecarts.push({
            zone: p.nom,
            libelle: s.libelle + (sup.revetement ? " (" + sup.revetement + ")" : ""),
            entree: sup.etatEntree,
            sortie: sup.etatSortie,
            observations: [sup.remarqueEntree, sup.remarqueSortie].filter(Boolean).join(" → "),
            photosEntree: p.photos.entree,
            photosSortie: p.photos.sortie
          });
        }
      });
    });

    dossier.mobilier.sections.forEach(function (sec) {
      sec.lignes.forEach(function (l) {
        if (l.absent || !l.etatEntree || !l.etatSortie) return;
        if (PL.RANG_MOBILIER[l.etatSortie] > PL.RANG_MOBILIER[l.etatEntree]) {
          ecarts.push({
            zone: sec.titre,
            libelle: l.libelle,
            entree: l.etatEntree,
            sortie: l.etatSortie,
            observations: l.observations,
            photosEntree: l.photos.entree,
            photosSortie: l.photos.sortie
          });
        }
      });
    });

    return ecarts;
  };

  PL.print.ecarts = function (dossier) {
    var liste = PL.print.calculerEcarts(dossier);
    var frag = document.createDocumentFragment();

    frag.appendChild(enteteDocument(dossier, "sortie",
      "Récapitulatif des écarts entrée / sortie",
      "Annexe au constat de sortie — postes dont l'état s'est dégradé"));
    frag.appendChild(blocIdentite(dossier, "sortie"));

    if (!liste.length) {
      frag.appendChild(el("p", { class: "p-zone-texte" },
        "Aucune dégradation constatée entre l'état des lieux d'entrée et celui de sortie."));
      frag.appendChild(blocSignatures(dossier, "sortie"));
      return frag;
    }

    frag.appendChild(el("p", { class: "p-legende" },
      "Ce récapitulatif est établi automatiquement par comparaison des états relevés " +
      "à l'entrée et à la sortie. Il ne vaut ni chiffrage, ni application d'une grille de vétusté."));

    liste.forEach(function (e) {
      var bloc = el("section", { class: "p-ecart p-eviter-coupure" },
        el("h3", null, e.zone + " — " + e.libelle),
        el("p", { class: "p-etat" },
          "État d'entrée : " + e.entree + "   →   État de sortie : " + e.sortie),
        e.observations ? el("p", null, e.observations) : null
      );
      var avant = (e.photosEntree || [])[0];
      var apres = (e.photosSortie || [])[0];
      if (avant || apres) {
        bloc.appendChild(el("div", { class: "p-avant-apres" },
          el("figure", null,
            avant ? image(avant.id, "Photo d'entrée") : el("div", { class: "p-photo-absente" }, "—"),
            el("figcaption", null, "Entrée")),
          el("figure", null,
            apres ? image(apres.id, "Photo de sortie") : el("div", { class: "p-photo-absente" }, "—"),
            el("figcaption", null, "Sortie"))
        ));
      }
      frag.appendChild(bloc);
    });

    frag.appendChild(blocSignatures(dossier, "sortie"));
    return frag;
  };

  /* --- lancement -------------------------------------------------------- */

  PL.print.construire = function (type, dossier, mode) {
    var conteneur = document.getElementById("conteneur-impression");
    PL.vider(conteneur);
    attentesImages = [];

    var docs = [];
    if (type === "edl") docs.push(PL.print.edl(dossier, mode));
    else if (type === "mobilier") docs.push(PL.print.mobilier(dossier, mode));
    else if (type === "ecarts") docs.push(PL.print.ecarts(dossier));
    else {
      docs.push(PL.print.edl(dossier, mode));
      docs.push(PL.print.mobilier(dossier, mode));
      if (mode === "sortie") docs.push(PL.print.ecarts(dossier));
    }

    docs.forEach(function (d, i) {
      var page = el("article", { class: "p-doc" + (i ? " p-doc--nouvelle-page" : "") });
      page.appendChild(d);
      conteneur.appendChild(page);
    });

    /* Pied unique, en position fixe : le moteur d'impression le réémet
       sur chaque page. Un pied par document se répéterait aussi sur les
       pages des documents suivants. */
    conteneur.appendChild(el("div", { class: "p-pied-global" },
      el("span", null, "Potentia Loan · " +
        texteOu(dossier.logement.adresse, "dossier sans adresse").split("\n")[0]),
      el("span", null, "Édité par Potentia Digital")
    ));

    conteneur.setAttribute("aria-hidden", "true");

    /* Filet : toute photo saisie dans la campagne imprimée doit se retrouver
       dans le document. Un emplacement ajouté à la saisie mais oublié ici se
       signale immédiatement au lieu de disparaître en silence. */
    if (type === "complet") {
      var attendues = PL.photos.idsDuDossier(dossier, mode).length;
      var produites = conteneur.querySelectorAll(".p-photos img").length;
      if (produites < attendues && window.console && window.console.warn) {
        window.console.warn(
          "Potentia Loan — " + (attendues - produites) + " photo(s) de la campagne « " +
          mode + " » ne sont pas reprises dans le document imprimé.");
      }
    }

    return Promise.all(attentesImages);
  };

  PL.print.lancer = function (type, dossier, mode) {
    PL.toast("Préparation du document…");
    return PL.print.construire(type, dossier, mode).then(function () {
      return new Promise(function (r) { setTimeout(r, 120); });
    }).then(function () {
      window.print();
    }).catch(function (e) {
      PL.toast("Impression impossible : " + (e && e.message ? e.message : "erreur"));
    });
  };
})();


/* === 90-app.js === */
/* ------------------------------------------------------------------
   Bootstrap : hub du dossier, routes, actions d'en-tête.
   ------------------------------------------------------------------ */

PL.version = "1.0.0";

/* --- hub du dossier --------------------------------------------------- */

PL.vues.hub = function (dossier, mode) {
  var prog = PL.progression(dossier, mode);
  var camp = dossier.campagnes[mode];
  var base = "/d/" + dossier.id + "/" + mode + "/";

  var racine = PL.el("div", null,
    PL.el("div", { class: "vue-entete" },
      PL.el("div", { class: "vue-entete__texte" },
        PL.el("div", { class: "vue-entete__sur" }, "Dossier"),
        PL.el("h1", null, dossier.logement.adresse || "Adresse non renseignée"),
        PL.el("div", { class: "dossier-ligne__meta" },
          (dossier.locataire.nom ? dossier.locataire.nom + " · " : "") +
          "modifié le " + PL.formaterDate(dossier.modifieLe))
      ),
      PL.el("div", { class: "app-entete__actions" },
        PL.el("button", {
          type: "button", class: "btn btn--petit",
          onclick: function () { PL.router.go("/"); }
        }, "Mes dossiers")
      )
    )
  );

  /* sélecteur de campagne */
  racine.appendChild(PL.el("section", { class: "carte" },
    PL.el("div", { class: "carte__entete" },
      PL.el("div", { class: "carte__titre" }, PL.el("h2", null, "Constat en cours")),
      PL.el("div", { class: "app-entete__actions" },
        ["entree", "sortie"].map(function (m) {
          return PL.el("button", {
            type: "button",
            class: "btn btn--petit" + (m === mode ? " btn--principal" : ""),
            "aria-current": m === mode ? "true" : "false",
            onclick: function () { PL.router.go("/d/" + dossier.id + "/" + m); }
          }, PL.libelleMode(m) + (dossier.campagnes[m].signeLe ? " ✓" : ""));
        })
      )
    ),
    PL.el("div", { class: "jauge" },
      PL.el("div", { class: "jauge__barre", style: "width:" + Math.max(2, prog.global.pourcent) + "%" })),
    PL.el("div", { class: "dossier-ligne__meta", style: "margin-top:6px" },
      prog.global.faits + " / " + prog.global.total + " postes renseignés — " +
      prog.global.pourcent + " %"),
    mode === "sortie" && !dossier.campagnes.entree.signeLe
      ? PL.el("div", { class: "note" },
          "Le constat d'entrée n'est pas encore signé. Les états d'entrée affichés en regard " +
          "restent modifiables depuis l'onglet Entrée.")
      : null,
    camp.verrouille
      ? PL.el("div", { class: "note note--alerte" },
          "Constat signé le " + PL.formaterDate(camp.signeLe) + " — lecture seule.")
      : null
  ));

  /* sections */
  var grille = PL.el("div", { class: "hub-grille" });
  PL.SECTIONS.forEach(function (s) {
    var p = prog[s.cle];
    var complet = p.total > 0 && p.faits >= p.total;
    grille.appendChild(PL.el("button", {
      type: "button", class: "hub-item",
      onclick: function () { PL.router.go(base + s.cle); }
    },
      PL.el("span", null,
        PL.el("span", { class: "hub-item__titre" }, s.titre),
        PL.el("span", { class: "hub-item__sous", style: "display:block" }, s.sous)
      ),
      PL.el("span", {
        class: "hub-item__compte" + (complet ? " hub-item__compte--complet" : "")
      }, p.faits + "/" + p.total)
    ));
  });
  racine.appendChild(grille);

  /* documents */
  racine.appendChild(PL.el("section", { class: "carte", style: "margin-top:16px" },
    PL.el("div", { class: "carte__entete" }, PL.el("h2", null, "Documents")),
    PL.el("p", { class: "dossier-ligne__meta" },
      "L'impression ouvre la boîte de dialogue du navigateur : choisissez « Enregistrer au " +
      "format PDF » comme destination, format A4, et activez les en-têtes si vous souhaitez " +
      "la numérotation des pages."),
    PL.el("div", { class: "app-entete__actions", style: "margin-top:10px" },
      PL.el("button", {
        type: "button", class: "btn btn--principal",
        onclick: function () { PL.print.lancer("edl", dossier, mode); }
      }, "Imprimer l'état des lieux"),
      PL.el("button", {
        type: "button", class: "btn",
        onclick: function () { PL.print.lancer("mobilier", dossier, mode); }
      }, "Imprimer l'inventaire"),
      PL.el("button", {
        type: "button", class: "btn",
        onclick: function () { PL.print.lancer("complet", dossier, mode); }
      }, "Imprimer le dossier complet"),
      mode === "sortie" ? PL.el("button", {
        type: "button", class: "btn",
        onclick: function () { PL.print.lancer("ecarts", dossier, mode); }
      }, "Imprimer le récapitulatif des écarts") : null
    )
  ));

  /* écarts entrée/sortie */
  if (mode === "sortie") {
    var ecarts = PL.print.calculerEcarts(dossier);
    racine.appendChild(PL.el("section", { class: "carte" },
      PL.el("div", { class: "carte__entete" },
        PL.el("h2", null, "Écarts entrée / sortie"),
        PL.el("span", { class: "hub-item__compte" }, String(ecarts.length))),
      ecarts.length
        ? PL.el("div", null,
            PL.el("p", { class: "dossier-ligne__meta" },
              "Postes dont l'état s'est dégradé entre l'entrée et la sortie. " +
              "Ce récapitulatif est imprimable en annexe."),
            PL.el("ul", { class: "liste-manques" },
              ecarts.slice(0, 12).map(function (e) {
                return PL.el("li", null,
                  e.zone + " — " + e.libelle + " : " + (e.entree || "—") + " → " + (e.sortie || "—"));
              }),
              ecarts.length > 12
                ? PL.el("li", null, "… et " + (ecarts.length - 12) + " autres.") : null)
          )
        : PL.el("p", { class: "dossier-ligne__meta" },
            "Aucune dégradation constatée pour l'instant.")
    ));
  }

  /* gestion du dossier */
  racine.appendChild(PL.el("section", { class: "carte carte--sourde" },
    PL.el("div", { class: "carte__entete" }, PL.el("h2", null, "Dossier")),
    PL.el("div", { class: "app-entete__actions" },
      PL.boutonEnvoi(dossier.id),
      PL.el("button", {
        type: "button", class: "btn btn--petit",
        onclick: function () {
          var id = PL.store.duplicate(dossier.id);
          PL.toast("Dossier dupliqué.");
          PL.router.go("/d/" + id + "/entree");
        }
      }, "Dupliquer")
    )
  ));

  return racine;
};

/* --- routes ------------------------------------------------------------ */

(function () {
  function avecDossier(params, rendu) {
    var dossier = PL.store.get(params.id);
    if (!dossier) {
      return PL.el("div", { class: "etat-vide" },
        PL.el("p", null, "Ce dossier n'existe pas ou a été supprimé."),
        PL.el("button", {
          type: "button", class: "btn btn--principal",
          onclick: function () { PL.router.go("/"); }
        }, "Retour à mes dossiers"));
    }
    var mode = params.mode === "sortie" ? "sortie" : "entree";
    return rendu(dossier, mode);
  }

  PL.router.define("/", function () { return PL.vues.accueil(); });

  PL.router.define("/d/:id/:mode", function (p) {
    return avecDossier(p, function (d, m) { return PL.vues.hub(d, m); });
  });

  PL.router.define("/d/:id/:mode/:section", function (p) {
    return avecDossier(p, function (d, m) {
      var vue = PL.vues[p.section];
      if (!vue) {
        PL.router.go("/d/" + d.id + "/" + m);
        return null;
      }
      return vue(d, m);
    });
  });
})();

/* --- actions permanentes de l'en-tête ---------------------------------- */

(function () {
  var zone = document.getElementById("app-actions");

  function themeCourant() {
    return document.documentElement.getAttribute("data-theme") ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light");
  }

  var bouton = PL.el("button", {
    type: "button", class: "btn btn--petit btn--discret",
    "aria-label": "Basculer entre le thème clair et le thème sombre",
    onclick: function () {
      var nouveau = themeCourant() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nouveau);
      try { window.localStorage.setItem("potentia-loan:theme", nouveau); } catch (e) {}
      bouton.textContent = nouveau === "dark" ? "Thème clair" : "Thème sombre";
    }
  }, themeCourant() === "dark" ? "Thème clair" : "Thème sombre");

  try {
    var memo = window.localStorage.getItem("potentia-loan:theme");
    if (memo) {
      document.documentElement.setAttribute("data-theme", memo);
      bouton.textContent = memo === "dark" ? "Thème clair" : "Thème sombre";
    }
  } catch (e) {}

  zone.appendChild(PL.el("button", {
    type: "button", class: "btn btn--petit btn--discret",
    onclick: function () { PL.router.go("/"); }
  }, "Mes dossiers"));
  zone.appendChild(bouton);
})();

PL.router.demarrer();

})();
</script>
